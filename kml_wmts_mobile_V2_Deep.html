<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>國土測繪中心 WMTS + KML 地圖</title>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

  <style>
    /* ===== 全域重置 ===== */
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8eef2;
    }

    /* ===== 控制面板 ===== */
    #controlPanel {
      position: absolute;
      z-index: 1000;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));
      width: 460px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);
      overflow: hidden;
      box-sizing: border-box;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.30);
    }

    #panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 45px;
      padding: 8px 10px 8px 13px;
      box-sizing: border-box;
      color: white;
      background: #1f5f99;
      cursor: pointer;
      user-select: none;
    }

    #panelTitle {
      font-size: 16px;
      font-weight: bold;
    }

    #togglePanelBtn {
      width: 34px;
      min-width: 34px;
      height: 30px;
      padding: 0;
      color: white;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.70);
      border-radius: 5px;
      font-size: 20px;
      line-height: 24px;
      cursor: pointer;
    }

    #panelContent {
      max-height: calc(100vh - 75px);
      padding: 10px 12px 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #controlPanel.collapsed #panelContent {
      display: none;
    }

    /* ===== 元件樣式 ===== */
    .sectionTitle {
      margin: 10px 0 6px;
      padding-top: 10px;
      border-top: 1px solid #dddddd;
      font-size: 14px;
      font-weight: bold;
    }
    .sectionTitle:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    select, input[type="file"], button {
      max-width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 15px;
    }

    select, input[type="file"] {
      width: 100%;
      margin-top: 5px;
    }

    button {
      padding: 7px 10px;
      color: #222;
      background: #fafafa;
      border: 1px solid #a9a9a9;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover { background: #eeeeee; }
    button:active { background: #dddddd; }
    button:disabled {
      color: #777;
      background: #dddddd;
      cursor: not-allowed;
    }

    #locationBtn {
      width: 100%;
      margin-top: 5px;
      color: white;
      background: #26743b;
      border-color: #1b5a2d;
      font-weight: bold;
    }
    #locationBtn:hover { background: #1e6130; }

    #clearAllBtn, #clearSavedDataBtn {
      width: 100%;
      margin-top: 7px;
    }

    #clearSavedDataBtn {
      color: #9b1d1d;
      background: #fff6f6;
      border-color: #d5a4a4;
    }
    #clearSavedDataBtn:hover { background: #ffe7e7; }

    .hint {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .autoSaveRow {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 5px;
      padding: 7px 8px;
      border: 1px solid #d6e2ec;
      border-radius: 5px;
      background: #f5faff;
      cursor: pointer;
      user-select: none;
    }
    .autoSaveRow input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    /* ===== 進度條 ===== */
    #progressContainer {
      display: none;
      margin-top: 8px;
      padding: 8px 10px;
      background: #f0f4f8;
      border-radius: 6px;
      border: 1px solid #d0d8e0;
    }
    #progressContainer.active {
      display: block;
    }
    #progressBarWrapper {
      width: 100%;
      height: 8px;
      background: #e0e4e8;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    #progressBar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #1f5f99, #4a8bc2);
      border-radius: 4px;
      transition: width 0.2s ease;
    }
    #progressText {
      font-size: 13px;
      color: #333;
      margin-bottom: 3px;
    }

    /* ===== 圖層清單 ===== */
    #layerList {
      margin-top: 7px;
    }

    .layerItem {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 3px 5px;
      padding: 6px 4px;
      border-bottom: 1px solid #e7e7e7;
      font-size: 14px;
      background: #fafcfe;
    }
    .layerItem:hover {
      background: #f4f8fc;
    }

    .layerItem input[type="checkbox"] {
      width: 17px;
      height: 17px;
      margin: 0;
      cursor: pointer;
      flex-shrink: 0;
    }

    .layerName {
      flex: 1;
      min-width: 50px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 500;
      font-size: 13px;
    }

    .layerItem button {
      min-width: 28px;
      padding: 3px 5px;
      font-size: 12px;
      flex-shrink: 0;
      border-radius: 4px;
    }

    .layerMoveBtn {
      min-width: 26px !important;
      padding: 2px 4px !important;
      font-size: 15px !important;
      font-weight: bold;
      line-height: 1;
    }
    .layerMoveBtn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    /* 圖層設定區 */
    .layerSettings {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      width: 100%;
      padding: 4px 0 2px 26px;
      font-size: 12px;
      color: #444;
      border-top: 1px dashed #e0e8f0;
      margin-top: 3px;
    }
    .layerSettings label {
      display: flex;
      align-items: center;
      gap: 3px;
      white-space: nowrap;
    }
    .layerSettings input[type="range"] {
      width: 80px;
      height: 4px;
      cursor: pointer;
      accent-color: #1f5f99;
    }
    .layerSettings input[type="number"] {
      width: 48px;
      padding: 2px 3px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      text-align: center;
    }
    .layerSettings select {
      width: auto;
      margin: 0;
      padding: 2px 4px;
      font-size: 12px;
      border: 1px solid #ccc;
      border-radius: 3px;
      background: white;
    }
    .layerSettings .settingLabel {
      font-weight: 500;
      color: #555;
      margin-right: 2px;
    }
    .layerSettings .opacityValue {
      min-width: 30px;
      text-align: center;
      font-size: 12px;
      color: #666;
    }

    /* ===== 狀態訊息 ===== */
    #status {
      display: block;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #dddddd;
      color: #333;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* ===== 行動裝置響應 ===== */
    @media (max-width: 700px) {
      #controlPanel {
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));
        width: calc(100vw - 12px);
        max-width: none;
        max-height: calc(100vh - 12px);
        border-radius: 8px;
      }
      #panelHeader {
        min-height: 42px;
      }
      #panelTitle {
        font-size: 15px;
      }
      #panelContent {
        max-height: calc(100vh - 62px);
        padding-bottom: 22px;
      }

      select, input[type="file"], button {
        font-size: 16px;
      }

      .layerItem {
        padding: 6px 3px;
        gap: 3px;
      }
      .layerItem button {
        min-width: 32px;
        padding: 4px 6px;
        font-size: 13px;
      }
      .layerMoveBtn {
        min-width: 30px !important;
        font-size: 16px !important;
      }
      .layerName {
        font-size: 13px;
        min-width: 40px;
      }
      .layerSettings {
        padding-left: 22px;
        gap: 3px 6px;
        font-size: 11px;
      }
      .layerSettings input[type="range"] {
        width: 60px;
      }
      .layerSettings input[type="number"] {
        width: 40px;
      }
    }
  </style>
</head>

<body>

  <div id="controlPanel">
    <div id="panelHeader">
      <span id="panelTitle">KML 圖層與測繪中心底圖</span>
      <button id="togglePanelBtn" type="button" title="收合控制欄">−</button>
    </div>

    <div id="panelContent">
      <!-- WMTS -->
      <div class="sectionTitle">國土測繪中心 WMTS 底圖</div>
      <select id="wmtsLayerSelect" disabled>
        <option>正在讀取 WMTS 圖層清單...</option>
      </select>
      <div class="hint">WMTS 圖層清單由國土測繪中心 GetCapabilities 自動讀取。</div>

      <!-- 定位 -->
      <div class="sectionTitle">目前位置</div>
      <button id="locationBtn" type="button">📍 定位到我的位置</button>
      <div class="hint">第一次使用時請允許瀏覽器使用位置資訊。</div>

      <!-- 載入 KML -->
      <div class="sectionTitle">載入本機 KML</div>
      <input id="fileInput" type="file" multiple accept=".kml,application/vnd.google-earth.kml+xml">
      <div class="hint">最多同時載入 10 個 KML。KML 僅在本機瀏覽器讀取，不會上傳。</div>

      <!-- 進度條 -->
      <div id="progressContainer">
        <div id="progressText">準備載入...</div>
        <div id="progressBarWrapper">
          <div id="progressBar" style="width:0%"></div>
        </div>
      </div>

      <!-- 自動記錄 -->
      <div class="sectionTitle">自動記錄</div>
      <label class="autoSaveRow">
        <input id="autoSaveCheckbox" type="checkbox" checked>
        <span>記住底圖、KML、圖層順序與地圖位置</span>
      </label>
      <div class="hint">記錄資料保存在目前裝置瀏覽器的 IndexedDB。</div>

      <!-- 圖層清單 -->
      <div class="sectionTitle">我的 KML 圖層</div>
      <div id="layerList">
        <div style="color:#666; font-size:14px;">尚未載入 KML。</div>
      </div>

      <button id="clearAllBtn" type="button">清除目前 KML 圖層</button>
      <button id="clearSavedDataBtn" type="button">清除快取資料與之前載入的 KML</button>
      <div class="hint">清除快取不會刪除手機或電腦中的原始 KML 檔案。</div>

      <span id="status">地圖初始化中...</span>
    </div>
  </div>

  <div id="map"></div>

  <script>
    "use strict";

    /**
     * ============================================================
     *  KML + WMTS 地圖應用程式（模組化版本）
     *  支援：圖層透明度、點標籤大小與欄位設定
     * ============================================================
     */

    (function() {

      // ============================================================
      //  1. 常數與設定
      // ============================================================

      const CONFIG = {
        WMTS_URL: 'https://wmts.nlsc.gov.tw/wmts',
        MAX_KML_LAYERS: 10,
        DB_NAME: 'nlsc-kml-map-db',
        DB_VERSION: 1,
        STORE_NAME: 'mapState',
        STATE_KEY: 'lastMapState',
        AUTO_SAVE_KEY: 'nlsc-kml-map-auto-save',
        SAVE_DEBOUNCE_MS: 700,
        LOCATION_TIMEOUT_MS: 15000,
        LOCATION_MAX_AGE_MS: 30000,
        ZOOM_PADDING: [90, 30, 30, 30],
        MAX_ZOOM_FIT: 18,
        ANIMATION_DURATION_MS: 500,
        DEFAULT_ZOOM: 7,
        MIN_ZOOM: 5,
        MAX_ZOOM: 20,
        DEFAULT_POINT_LABEL_SIZE: 13,
        MIN_POINT_LABEL_SIZE: 8,
        MAX_POINT_LABEL_SIZE: 28,
        DEFAULT_OPACITY: 1.0,
        POINT_LABEL_FIELDS: ['name', 'description', ''],
      };

      // ============================================================
      //  2. DOM 參考
      // ============================================================

      const DOM = {
        controlPanel: document.getElementById('controlPanel'),
        panelHeader: document.getElementById('panelHeader'),
        togglePanelBtn: document.getElementById('togglePanelBtn'),
        wmtsLayerSelect: document.getElementById('wmtsLayerSelect'),
        locationBtn: document.getElementById('locationBtn'),
        fileInput: document.getElementById('fileInput'),
        autoSaveCheckbox: document.getElementById('autoSaveCheckbox'),
        layerList: document.getElementById('layerList'),
        clearAllBtn: document.getElementById('clearAllBtn'),
        clearSavedDataBtn: document.getElementById('clearSavedDataBtn'),
        status: document.getElementById('status'),
        progressContainer: document.getElementById('progressContainer'),
        progressBar: document.getElementById('progressBar'),
        progressText: document.getElementById('progressText'),
        mapContainer: document.getElementById('map'),
      };

      // ============================================================
      //  3. 應用程式狀態（模組封裝）
      // ============================================================

      const AppState = {
        /** @type {IDBDatabase|null} */
        database: null,

        /** @type {Object|null} WMTS GetCapabilities 解析結果 */
        wmtsCapabilities: null,

        /** @type {ol.layer.Tile|null} 目前 WMTS 圖層 */
        wmtsLayer: null,

        /** @type {ol.layer.Vector|null} 使用者位置圖層 */
        userLocationLayer: null,

        /** @type {Array<Object>} KML 圖層資料陣列 */
        kmlLayers: [],

        /** @type {number} 圖層 ID 計數器 */
        nextLayerId: 1,

        /** @type {boolean} 是否正在還原儲存狀態 */
        isRestoring: false,

        /** @type {number|null} 自動儲存計時器 */
        saveTimer: null,

        /** @type {number|null} 定位監聽 ID */
        locationWatchId: null,

        /** @type {ol.Map} OpenLayers 地圖實例 */
        map: null,

        /** @type {ol.View} 地圖視圖 */
        view: null,

        /** @type {Function} 目前點樣式產生器（用於更新） */
        pointStyleFunction: null,
      };

      // ============================================================
      //  4. 工具函式
      // ============================================================

      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = String(value);
        return div.innerHTML;
      }

      /**
       * 清理 KML 文字中的潛在惡意內容
       */
      function sanitizeKmlText(kmlText) {
        return String(kmlText)
          .replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '')
          .replace(/\s+on\w+\s*=\s*["'][^"']*["']/gi, '')
          .replace(/\s+on\w+\s*=\s*[^\s>]+/gi, '')
          .replace(/javascript\s*:/gi, '');
      }

      /**
       * 檢查檔案是否為有效的 KML
       */
      function isValidKmlFile(file) {
        const lowerName = file.name.toLowerCase();
        if (!lowerName.endsWith('.kml')) return false;

        const validTypes = [
          'application/vnd.google-earth.kml+xml',
          'text/xml', 'application/xml', 'text/plain',
        ];
        if (file.type && !validTypes.includes(file.type)) {
          return false;
        }
        return true;
      }

      function setStatus(message, level = 'info') {
        const el = DOM.status;
        const prefix = level === 'error' ? '❌ ' :
                       level === 'warn' ? '⚠️ ' : '';
        el.textContent = prefix + message;
      }

      function updateProgress(current, total, fileName) {
        const container = DOM.progressContainer;
        const bar = DOM.progressBar;
        const text = DOM.progressText;

        if (total === 0) {
          container.classList.remove('active');
          return;
        }

        container.classList.add('active');
        const percent = Math.round((current / total) * 100);
        bar.style.width = percent + '%';
        text.textContent = `載入中 (${current}/${total})：${fileName || ''}`;

        if (current >= total) {
          setTimeout(() => container.classList.remove('active'), 800);
        }
      }

      // ============================================================
      //  5. IndexedDB 操作（與之前相同，省略註解以節省篇幅）
      // ============================================================

      function openDatabase() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(CONFIG.DB_NAME, CONFIG.DB_VERSION);
          request.onupgradeneeded = function(event) {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(CONFIG.STORE_NAME)) {
              db.createObjectStore(CONFIG.STORE_NAME);
            }
          };
          request.onsuccess = function(event) {
            AppState.database = event.target.result;
            resolve(AppState.database);
          };
          request.onerror = function() { reject(request.error); };
        });
      }

      function dbGet(key) {
        return new Promise((resolve, reject) => {
          const db = AppState.database;
          if (!db) { reject(new Error('IndexedDB 尚未初始化。')); return; }
          const transaction = db.transaction(CONFIG.STORE_NAME, 'readonly');
          const store = transaction.objectStore(CONFIG.STORE_NAME);
          const request = store.get(key);
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }

      function dbSet(key, value) {
        return new Promise((resolve, reject) => {
          const db = AppState.database;
          if (!db) { reject(new Error('IndexedDB 尚未初始化。')); return; }
          const transaction = db.transaction(CONFIG.STORE_NAME, 'readwrite');
          const store = transaction.objectStore(CONFIG.STORE_NAME);
          store.put(value, key);
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error);
        });
      }

      function dbDelete(key) {
        return new Promise((resolve, reject) => {
          const db = AppState.database;
          if (!db) { reject(new Error('IndexedDB 尚未初始化。')); return; }
          const transaction = db.transaction(CONFIG.STORE_NAME, 'readwrite');
          const store = transaction.objectStore(CONFIG.STORE_NAME);
          store.delete(key);
          transaction.oncomplete = () => resolve();
          transaction.onerror = () => reject(transaction.error);
        });
      }

      // ============================================================
      //  6. 自動記錄功能（與之前相同）
      // ============================================================

      function getAutoSaveEnabled() {
        const value = localStorage.getItem(CONFIG.AUTO_SAVE_KEY);
        return value === null ? true : value === 'true';
      }

      function setAutoSaveEnabled(enabled) {
        localStorage.setItem(CONFIG.AUTO_SAVE_KEY, enabled ? 'true' : 'false');
      }

      function getCurrentMapState() {
        const view = AppState.view;
        return {
          savedAt: new Date().toISOString(),
          wmtsLayer: DOM.wmtsLayerSelect.value || null,
          view: {
            center: view.getCenter() || null,
            zoom: view.getZoom() || CONFIG.DEFAULT_ZOOM,
            rotation: view.getRotation() || 0,
          },
          kmlLayers: AppState.kmlLayers.map(layerData => ({
            name: layerData.name,
            text: layerData.text,
            visible: layerData.layer.getVisible(),
            opacity: layerData.opacity !== undefined ? layerData.opacity : CONFIG.DEFAULT_OPACITY,
            pointLabelSize: layerData.pointLabelSize || CONFIG.DEFAULT_POINT_LABEL_SIZE,
            pointLabelField: layerData.pointLabelField || 'name',
          })),
        };
      }

      async function saveCurrentMapState() {
        const db = AppState.database;
        if (!db) return;
        if (!DOM.autoSaveCheckbox.checked) return;
        if (AppState.isRestoring) return;

        try {
          const state = getCurrentMapState();
          await dbSet(CONFIG.STATE_KEY, state);
        } catch (error) {
          console.warn('儲存資料失敗：', error);
          if (error.name === 'QuotaExceededError') {
            setStatus('KML 太大，瀏覽器儲存空間不足，無法自動記錄。', 'warn');
          }
        }
      }

      function scheduleSaveMapState() {
        if (!DOM.autoSaveCheckbox.checked) return;
        if (AppState.isRestoring) return;
        clearTimeout(AppState.saveTimer);
        AppState.saveTimer = setTimeout(saveCurrentMapState, CONFIG.SAVE_DEBOUNCE_MS);
      }

      // ============================================================
      //  7. 地圖初始化
      // ============================================================

      function createMap() {
        const view = new ol.View({
          projection: 'EPSG:3857',
          center: ol.proj.fromLonLat([120.9, 23.7]),
          zoom: CONFIG.DEFAULT_ZOOM,
          minZoom: CONFIG.MIN_ZOOM,
          maxZoom: CONFIG.MAX_ZOOM,
        });

        AppState.view = view;

        const map = new ol.Map({
          target: DOM.mapContainer,
          layers: [],
          view: view,
        });

        map.on('moveend', scheduleSaveMapState);

        AppState.map = map;
        return map;
      }

      // ============================================================
      //  8. WMTS 功能（與之前相同）
      // ============================================================

      async function loadWmtsCapabilities(preferredLayerName = null) {
        try {
          setStatus('正在讀取 WMTS 圖層清單...');
          const url = `${CONFIG.WMTS_URL}?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0`;
          const response = await fetch(url);
          if (!response.ok) throw new Error(`WMTS 回應錯誤，HTTP ${response.status}`);

          const xmlText = await response.text();
          const parser = new ol.format.WMTSCapabilities();
          AppState.wmtsCapabilities = parser.read(xmlText);

          const layers = AppState.wmtsCapabilities?.Contents?.Layer;
          if (!layers || layers.length === 0) throw new Error('WMTS 沒有回傳可用圖層。');

          DOM.wmtsLayerSelect.innerHTML = '';
          layers.forEach(layerInfo => {
            const option = document.createElement('option');
            option.value = layerInfo.Identifier;
            option.textContent = layerInfo.Title || layerInfo.Identifier;
            DOM.wmtsLayerSelect.appendChild(option);
          });
          DOM.wmtsLayerSelect.disabled = false;

          const availableNames = Array.from(DOM.wmtsLayerSelect.options).map(o => o.value);
          let selectedName = null;
          if (preferredLayerName && availableNames.includes(preferredLayerName)) {
            selectedName = preferredLayerName;
          } else if (availableNames.includes('EMAP')) {
            selectedName = 'EMAP';
          } else {
            selectedName = layers[0].Identifier;
          }

          DOM.wmtsLayerSelect.value = selectedName;
          setWmtsLayer(selectedName);
          setStatus(`WMTS 圖層清單讀取完成，共 ${layers.length} 個圖層。`);
        } catch (error) {
          console.error(error);
          setStatus(`WMTS 讀取失敗：${error.message}`, 'error');
          DOM.wmtsLayerSelect.innerHTML = '<option>讀取失敗，請重新整理</option>';
        }
      }

      function setWmtsLayer(layerName) {
        try {
          const caps = AppState.wmtsCapabilities;
          if (!caps) return;

          const options = ol.source.WMTS.optionsFromCapabilities(caps, {
            layer: layerName,
            projection: 'EPSG:3857',
          });

          if (!options) throw new Error(`找不到 EPSG:3857 設定：${layerName}`);

          const newLayer = new ol.layer.Tile({
            source: new ol.source.WMTS(options),
            zIndex: 0,
          });

          const map = AppState.map;
          if (AppState.wmtsLayer) map.removeLayer(AppState.wmtsLayer);

          AppState.wmtsLayer = newLayer;
          map.getLayers().insertAt(0, newLayer);

          setStatus(`已切換底圖：${layerName}`);
          scheduleSaveMapState();
        } catch (error) {
          console.error(error);
          setStatus(`WMTS 底圖載入失敗：${error.message}`, 'error');
        }
      }

      // ============================================================
      //  9. 點標籤樣式產生器（核心新增）
      // ============================================================

      /**
       * 產生點圖徵的樣式
       * @param {string|function} fieldOrFn - 欄位名稱或取得文字的函式
       * @param {number} fontSize - 文字大小
       * @returns {Function} OpenLayers Style Function
       */
      function createPointStyleFunction(fieldOrFn, fontSize) {
        const size = Math.min(Math.max(fontSize || CONFIG.DEFAULT_POINT_LABEL_SIZE, CONFIG.MIN_POINT_LABEL_SIZE), CONFIG.MAX_POINT_LABEL_SIZE);

        return function(feature) {
          const geometry = feature.getGeometry();
          if (!geometry) return null;

          const type = geometry.getType();
          if (type !== 'Point' && type !== 'MultiPoint') return null;

          // 取得標籤文字
          let labelText = '';
          if (typeof fieldOrFn === 'function') {
            labelText = String(fieldOrFn(feature) || '');
          } else if (typeof fieldOrFn === 'string') {
            const value = feature.get(fieldOrFn);
            labelText = value !== undefined && value !== null ? String(value) : '';
          } else {
            labelText = String(feature.get('name') || '');
          }

          // 擷取前 50 個字元避免太長
          if (labelText.length > 50) {
            labelText = labelText.substring(0, 47) + '...';
          }

          return new ol.style.Style({
            image: new ol.style.Circle({
              radius: 7,
              fill: new ol.style.Fill({ color: 'rgba(235, 40, 40, 0.95)' }),
              stroke: new ol.style.Stroke({ color: '#ffffff', width: 2 }),
            }),
            text: new ol.style.Text({
              text: labelText,
              offsetY: -16,
              font: `bold ${size}px Arial, Microsoft JhengHei, sans-serif`,
              fill: new ol.style.Fill({ color: '#202020' }),
              stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }),
              overflow: true,
            }),
          });
        };
      }

      /**
       * 更新圖層的點樣式
       * @param {Object} layerData
       */
      function updatePointStyles(layerData) {
        const field = layerData.pointLabelField || 'name';
        const size = layerData.pointLabelSize || CONFIG.DEFAULT_POINT_LABEL_SIZE;

        // 建立樣式函式
        const styleFn = createPointStyleFunction(field, size);

        // 應用樣式到所有點圖徵
        const features = layerData.source.getFeatures();
        features.forEach(feature => {
          const geometry = feature.getGeometry();
          if (!geometry) return;
          const type = geometry.getType();
          if (type === 'Point' || type === 'MultiPoint') {
            feature.setStyle(styleFn);
          }
        });

        // 強制重新渲染
        layerData.layer.changed();
      }

      /**
       * 更新圖層透明度
       * @param {Object} layerData
       */
      function updateLayerOpacity(layerData) {
        const opacity = layerData.opacity !== undefined ? layerData.opacity : CONFIG.DEFAULT_OPACITY;
        layerData.layer.setOpacity(opacity);
      }

      // ============================================================
      //  10. KML 圖層功能（擴充支援透明度與點設定）
      // ============================================================

      function createKmlLayerFromText(fileName, kmlText, visible = true, autoZoom = false, shouldSave = true) {
        const sanitizedText = sanitizeKmlText(kmlText);

        const kmlFormat = new ol.format.KML({
          extractStyles: true,
          showPointNames: false,
        });

        const features = kmlFormat.readFeatures(sanitizedText, {
          dataProjection: 'EPSG:4326',
          featureProjection: 'EPSG:3857',
        });

        if (!features || features.length === 0) {
          throw new Error('沒有讀到可用的點、線或面圖徵。');
        }

        // 收集所有欄位名稱（用於下拉選單）
        const fieldSet = new Set();
        features.forEach(f => {
          const keys = f.getKeys();
          keys.forEach(k => fieldSet.add(k));
        });
        // 排除 geometry
        fieldSet.delete('geometry');

        // 建立點樣式（預設使用 name 欄位）
        const defaultField = fieldSet.has('name') ? 'name' :
                             fieldSet.has('description') ? 'description' :
                             fieldSet.has('title') ? 'title' :
                             fieldSet.has('標題') ? '標題' :
                             Array.from(fieldSet)[0] || '';

        const styleFn = createPointStyleFunction(defaultField, CONFIG.DEFAULT_POINT_LABEL_SIZE);

        // 先清除所有 feature 的樣式，再套用點樣式
        features.forEach(feature => {
          const geometry = feature.getGeometry();
          if (!geometry) return;
          const type = geometry.getType();
          if (type === 'Point' || type === 'MultiPoint') {
            feature.setStyle(styleFn);
          }
          // 非點圖徵保留 KML 原始樣式（不覆蓋）
        });

        const source = new ol.source.Vector({
          features: features,
          declutter: true,
        });

        const vectorLayer = new ol.layer.Vector({
          source: source,
          visible: visible,
          opacity: CONFIG.DEFAULT_OPACITY,
          zIndex: 10 + AppState.kmlLayers.length,
        });

        const layerData = {
          id: AppState.nextLayerId++,
          name: fileName,
          text: sanitizedText,
          layer: vectorLayer,
          source: source,
          opacity: CONFIG.DEFAULT_OPACITY,
          pointLabelSize: CONFIG.DEFAULT_POINT_LABEL_SIZE,
          pointLabelField: defaultField,
          availableFields: Array.from(fieldSet),
          hasPoints: features.some(f => {
            const g = f.getGeometry();
            return g && (g.getType() === 'Point' || g.getType() === 'MultiPoint');
          }),
        };

        AppState.map.addLayer(vectorLayer);
        AppState.kmlLayers.push(layerData);

        updateKmlLayerZIndex();
        renderLayerList();

        if (autoZoom) zoomToLayer(layerData);
        if (shouldSave) scheduleSaveMapState();

        return layerData;
      }

      function updateKmlLayerZIndex() {
        AppState.kmlLayers.forEach((layerData, index) => {
          layerData.layer.setZIndex(10 + index);
        });
      }

      function zoomToLayer(layerData) {
        const extent = layerData.source.getExtent();
        if (ol.extent.isEmpty(extent)) {
          alert('此圖層沒有可定位的範圍。');
          return;
        }
        AppState.view.fit(extent, {
          padding: CONFIG.ZOOM_PADDING,
          maxZoom: CONFIG.MAX_ZOOM_FIT,
          duration: CONFIG.ANIMATION_DURATION_MS,
        });
      }

      function removeKmlLayer(id) {
        const index = AppState.kmlLayers.findIndex(item => item.id === id);
        if (index === -1) return;

        const layerData = AppState.kmlLayers[index];
        AppState.map.removeLayer(layerData.layer);
        AppState.kmlLayers.splice(index, 1);

        updateKmlLayerZIndex();
        renderLayerList();
        scheduleSaveMapState();
        setStatus(`已移除圖層：${layerData.name}`);
      }

      function moveKmlLayer(id, direction) {
        const currentIndex = AppState.kmlLayers.findIndex(item => item.id === id);
        if (currentIndex === -1) return;

        const targetIndex = currentIndex + direction;
        if (targetIndex < 0 || targetIndex >= AppState.kmlLayers.length) return;

        const temp = AppState.kmlLayers[currentIndex];
        AppState.kmlLayers[currentIndex] = AppState.kmlLayers[targetIndex];
        AppState.kmlLayers[targetIndex] = temp;

        updateKmlLayerZIndex();
        renderLayerList();
        scheduleSaveMapState();
        setStatus(`已調整圖層順序：${temp.name}`);
      }

      function clearCurrentKmlLayers() {
        AppState.kmlLayers.forEach(layerData => {
          AppState.map.removeLayer(layerData.layer);
        });
        AppState.kmlLayers = [];
        updateKmlLayerZIndex();
        renderLayerList();
      }

      // ============================================================
      //  11. 圖層清單渲染（含透明度、點標籤設定）
      // ============================================================

      function renderLayerList() {
        const el = DOM.layerList;
        el.innerHTML = '';

        if (AppState.kmlLayers.length === 0) {
          el.innerHTML = '<div style="color:#666; font-size:14px;">尚未載入 KML。</div>';
          return;
        }

        AppState.kmlLayers.forEach((layerData, index) => {
          const container = document.createElement('div');
          container.className = 'layerItem';

          // ---- 第一行：基本控制 ----
          const row1 = document.createElement('div');
          row1.style.cssText = 'display:flex; align-items:center; gap:4px; width:100%; flex-wrap:wrap;';

          // 顯示/隱藏
          const checkbox = document.createElement('input');
          checkbox.type = 'checkbox';
          checkbox.checked = layerData.layer.getVisible();
          checkbox.title = '顯示或隱藏圖層';
          checkbox.addEventListener('change', function() {
            layerData.layer.setVisible(this.checked);
            scheduleSaveMapState();
          });

          // 圖層名稱
          const nameSpan = document.createElement('span');
          nameSpan.className = 'layerName';
          const hasPointIcon = layerData.hasPoints ? '📍' : '🗺️';
          nameSpan.textContent = `[${index + 1}] ${hasPointIcon} ${layerData.name}`;
          nameSpan.title = layerData.name;

          // 移動按鈕
          const upBtn = document.createElement('button');
          upBtn.type = 'button';
          upBtn.textContent = '↑';
          upBtn.className = 'layerMoveBtn';
          upBtn.title = '圖層往上移';
          upBtn.disabled = index === AppState.kmlLayers.length - 1;
          upBtn.addEventListener('click', () => moveKmlLayer(layerData.id, +1));

          const downBtn = document.createElement('button');
          downBtn.type = 'button';
          downBtn.textContent = '↓';
          downBtn.className = 'layerMoveBtn';
          downBtn.title = '圖層往下移';
          downBtn.disabled = index === 0;
          downBtn.addEventListener('click', () => moveKmlLayer(layerData.id, -1));

          const zoomBtn = document.createElement('button');
          zoomBtn.type = 'button';
          zoomBtn.textContent = '定位';
          zoomBtn.title = '縮放至此圖層範圍';
          zoomBtn.addEventListener('click', () => zoomToLayer(layerData));

          const removeBtn = document.createElement('button');
          removeBtn.type = 'button';
          removeBtn.textContent = '✕';
          removeBtn.title = '移除此 KML 圖層';
          removeBtn.style.color = '#b33';
          removeBtn.addEventListener('click', () => removeKmlLayer(layerData.id));

          row1.appendChild(checkbox);
          row1.appendChild(nameSpan);
          row1.appendChild(upBtn);
          row1.appendChild(downBtn);
          row1.appendChild(zoomBtn);
          row1.appendChild(removeBtn);
          container.appendChild(row1);

          // ---- 第二行：圖層設定 ----
          const settings = document.createElement('div');
          settings.className = 'layerSettings';

          // 透明度
          const opacityLabel = document.createElement('label');
          opacityLabel.innerHTML = '<span class="settingLabel">透明度</span>';
          const opacityRange = document.createElement('input');
          opacityRange.type = 'range';
          opacityRange.min = '0';
          opacityRange.max = '100';
          opacityRange.value = String(Math.round((layerData.opacity || CONFIG.DEFAULT_OPACITY) * 100));
          opacityRange.step = '1';
          const opacityValue = document.createElement('span');
          opacityValue.className = 'opacityValue';
          opacityValue.textContent = opacityRange.value + '%';

          opacityRange.addEventListener('input', function() {
            const val = parseInt(this.value) / 100;
            opacityValue.textContent = this.value + '%';
            layerData.opacity = val;
            updateLayerOpacity(layerData);
            scheduleSaveMapState();
          });

          opacityLabel.appendChild(opacityRange);
          opacityLabel.appendChild(opacityValue);
          settings.appendChild(opacityLabel);

          // 點標籤設定（僅當圖層有點圖徵時顯示）
          if (layerData.hasPoints) {
            // 分隔
            const sep = document.createElement('span');
            sep.textContent = '｜';
            sep.style.color = '#ccc';
            settings.appendChild(sep);

            // 欄位選擇
            const fieldLabel = document.createElement('label');
            fieldLabel.innerHTML = '<span class="settingLabel">標籤欄位</span>';
            const fieldSelect = document.createElement('select');
            fieldSelect.title = '選擇要顯示的欄位';

            // 加入預設選項
            const fieldOptions = ['name', 'description', 'title', '標題'];
            const available = layerData.availableFields || [];

            // 合併並去重
            const allFields = [...new Set([...fieldOptions, ...available])].filter(f => f);

            allFields.forEach(f => {
              const opt = document.createElement('option');
              opt.value = f;
              opt.textContent = f;
              if (f === layerData.pointLabelField) opt.selected = true;
              fieldSelect.appendChild(opt);
            });

            // 如果當前選中的不在清單中，加入
            if (layerData.pointLabelField && !allFields.includes(layerData.pointLabelField)) {
              const opt = document.createElement('option');
              opt.value = layerData.pointLabelField;
              opt.textContent = layerData.pointLabelField + ' (自訂)';
              opt.selected = true;
              fieldSelect.appendChild(opt);
            }

            fieldSelect.addEventListener('change', function() {
              layerData.pointLabelField = this.value;
              updatePointStyles(layerData);
              scheduleSaveMapState();
            });

            fieldLabel.appendChild(fieldSelect);
            settings.appendChild(fieldLabel);

            // 文字大小
            const sizeLabel = document.createElement('label');
            sizeLabel.innerHTML = '<span class="settingLabel">大小</span>';
            const sizeInput = document.createElement('input');
            sizeInput.type = 'number';
            sizeInput.min = CONFIG.MIN_POINT_LABEL_SIZE;
            sizeInput.max = CONFIG.MAX_POINT_LABEL_SIZE;
            sizeInput.value = layerData.pointLabelSize || CONFIG.DEFAULT_POINT_LABEL_SIZE;
            sizeInput.step = '1';
            sizeInput.title = '標籤文字大小 (8~28)';

            sizeInput.addEventListener('change', function() {
              let val = parseInt(this.value) || CONFIG.DEFAULT_POINT_LABEL_SIZE;
              val = Math.min(Math.max(val, CONFIG.MIN_POINT_LABEL_SIZE), CONFIG.MAX_POINT_LABEL_SIZE);
              this.value = val;
              layerData.pointLabelSize = val;
              updatePointStyles(layerData);
              scheduleSaveMapState();
            });

            sizeLabel.appendChild(sizeInput);
            settings.appendChild(sizeLabel);
          }

          container.appendChild(settings);
          el.appendChild(container);
        });
      }

      // ============================================================
      //  12. KML 檔案載入（含進度回饋）
      // ============================================================

      function loadSingleKmlFile(file, index, total) {
        return new Promise((resolve) => {
          if (!isValidKmlFile(file)) {
            setStatus(`略過非 KML 檔案：${file.name}`, 'warn');
            resolve(null);
            return;
          }

          updateProgress(index - 1, total, file.name);
          setStatus(`正在讀取 KML：${file.name}`);

          const reader = new FileReader();
          reader.onload = function(event) {
            try {
              const kmlText = event.target.result;
              const layerData = createKmlLayerFromText(
                file.name, kmlText, true, false, true
              );
              updateProgress(index, total, file.name);
              setStatus(`已載入 KML：${file.name}，共 ${layerData.source.getFeatures().length} 個圖徵。`);
              resolve(layerData);
            } catch (error) {
              console.error(error);
              setStatus(`載入失敗 ${file.name}：${error.message}`, 'error');
              updateProgress(index, total, file.name);
              resolve(null);
            }
          };
          reader.onerror = function() {
            setStatus(`檔案讀取失敗：${file.name}`, 'error');
            updateProgress(index, total, file.name);
            resolve(null);
          };
          reader.readAsText(file, 'UTF-8');
        });
      }

      async function handleKmlFiles(files) {
        const fileArray = Array.from(files);
        if (fileArray.length === 0) return;

        const remaining = CONFIG.MAX_KML_LAYERS - AppState.kmlLayers.length;
        if (remaining <= 0) {
          alert(`目前最多只能同時載入 ${CONFIG.MAX_KML_LAYERS} 個 KML 圖層。`);
          DOM.fileInput.value = '';
          return;
        }

        let loadFiles = fileArray;
        if (fileArray.length > remaining) {
          alert(`目前還可載入 ${remaining} 個 KML，超出的檔案不會載入。`);
          loadFiles = fileArray.slice(0, remaining);
        }

        DOM.progressContainer.classList.add('active');
        DOM.progressBar.style.width = '0%';

        let loadedCount = 0;
        const total = loadFiles.length;

        for (let i = 0; i < total; i++) {
          const result = await loadSingleKmlFile(loadFiles[i], i + 1, total);
          if (result) loadedCount++;
        }

        updateProgress(total, total, '完成！');
        DOM.progressContainer.classList.remove('active');

        if (AppState.kmlLayers.length > 0 && loadedCount > 0) {
          zoomToLayer(AppState.kmlLayers[0]);
        }

        setStatus(`載入完成，成功載入 ${loadedCount} 個 KML 圖層。`);
        DOM.fileInput.value = '';
      }

      // ============================================================
      //  13. GPS 定位功能（與之前相同）
      // ============================================================

      function showUserLocation(coordinate, accuracy) {
        const map = AppState.map;
        if (AppState.userLocationLayer) map.removeLayer(AppState.userLocationLayer);

        const locationFeature = new ol.Feature({
          geometry: new ol.geom.Point(coordinate),
        });
        const accuracyFeature = new ol.Feature({
          geometry: new ol.geom.Circle(coordinate, accuracy),
        });

        const layer = new ol.layer.Vector({
          source: new ol.source.Vector({ features: [accuracyFeature, locationFeature] }),
          zIndex: 999,
          style: function(feature) {
            const geomType = feature.getGeometry().getType();
            if (geomType === 'Circle') {
              return new ol.style.Style({
                fill: new ol.style.Fill({ color: 'rgba(30, 120, 255, 0.13)' }),
                stroke: new ol.style.Stroke({ color: 'rgba(30, 120, 255, 0.75)', width: 2 }),
              });
            }
            return new ol.style.Style({
              image: new ol.style.Circle({
                radius: 8,
                fill: new ol.style.Fill({ color: '#1677ff' }),
                stroke: new ol.style.Stroke({ color: '#ffffff', width: 3 }),
              }),
            });
          },
        });

        AppState.userLocationLayer = layer;
        map.addLayer(layer);
      }

      function performLocation() {
        if (!navigator.geolocation) {
          alert('此瀏覽器不支援定位功能。');
          return;
        }

        const btn = DOM.locationBtn;
        btn.disabled = true;
        btn.textContent = '正在定位...';
        setStatus('正在要求定位權限與取得目前位置...');

        if (AppState.locationWatchId !== null) {
          navigator.geolocation.clearWatch(AppState.locationWatchId);
          AppState.locationWatchId = null;
        }

        navigator.geolocation.getCurrentPosition(
          function(position) {
            const lon = position.coords.longitude;
            const lat = position.coords.latitude;
            const accuracy = position.coords.accuracy;
            const coord = ol.proj.fromLonLat([lon, lat]);

            showUserLocation(coord, accuracy);
            AppState.view.animate({ center: coord, zoom: 17, duration: 600 });

            btn.disabled = false;
            btn.textContent = '📍 定位到我的位置';
            setStatus(`定位完成。經度：${lon.toFixed(6)}，緯度：${lat.toFixed(6)}，誤差約 ±${Math.round(accuracy)} 公尺。`);
          },
          function(error) {
            btn.disabled = false;
            btn.textContent = '📍 定位到我的位置';

            let message = '定位失敗。';
            switch (error.code) {
              case error.PERMISSION_DENIED:
                message = '定位被拒絕。請在瀏覽器網站權限中允許位置資訊。';
                break;
              case error.POSITION_UNAVAILABLE:
                message = '目前無法取得位置，請確認 GPS、行動網路或 Wi-Fi 已啟用。';
                break;
              case error.TIMEOUT:
                message = '定位逾時，請到戶外或訊號較佳的位置後再試一次。';
                break;
            }
            setStatus(message, 'error');
            alert(message);
          },
          {
            enableHighAccuracy: true,
            timeout: CONFIG.LOCATION_TIMEOUT_MS,
            maximumAge: CONFIG.LOCATION_MAX_AGE_MS,
          }
        );
      }

      // ============================================================
      //  14. 狀態還原（擴充支援透明度與點設定）
      // ============================================================

      async function restoreSavedMapState(savedState) {
        if (!savedState) return;
        if (!DOM.autoSaveCheckbox.checked) return;

        AppState.isRestoring = true;

        try {
          if (Array.isArray(savedState.kmlLayers)) {
            const restoreList = savedState.kmlLayers.slice(0, CONFIG.MAX_KML_LAYERS);

            for (const savedLayer of restoreList) {
              if (!savedLayer.name || !savedLayer.text) continue;
              try {
                const layerData = createKmlLayerFromText(
                  savedLayer.name,
                  savedLayer.text,
                  savedLayer.visible !== false,
                  false,
                  false
                );

                // 還原透明度
                if (savedLayer.opacity !== undefined) {
                  layerData.opacity = savedLayer.opacity;
                  layerData.layer.setOpacity(savedLayer.opacity);
                }

                // 還原點標籤設定
                if (savedLayer.pointLabelSize !== undefined) {
                  layerData.pointLabelSize = savedLayer.pointLabelSize;
                }
                if (savedLayer.pointLabelField !== undefined) {
                  layerData.pointLabelField = savedLayer.pointLabelField;
                }

                // 更新點樣式
                if (layerData.hasPoints) {
                  updatePointStyles(layerData);
                }

              } catch (error) {
                console.warn(`無法還原 KML：${savedLayer.name}`, error);
              }
            }
          }

          // 還原地圖位置
          if (savedState.view && Array.isArray(savedState.view.center) && savedState.view.center.length === 2) {
            AppState.view.setCenter(savedState.view.center);
            AppState.view.setZoom(savedState.view.zoom || CONFIG.DEFAULT_ZOOM);
            if (typeof savedState.view.rotation === 'number') {
              AppState.view.setRotation(savedState.view.rotation);
            }
          } else if (AppState.kmlLayers.length > 0) {
            zoomToLayer(AppState.kmlLayers[0]);
          }

          if (AppState.kmlLayers.length > 0) {
            setStatus(`已還原 ${AppState.kmlLayers.length} 個 KML 圖層。`);
          }

        } catch (error) {
          console.warn('還原資料失敗：', error);
        } finally {
          AppState.isRestoring = false;
        }
      }

      // ============================================================
      //  15. 事件綁定
      // ============================================================

      function bindEvents() {
        // 控制面板收合
        DOM.togglePanelBtn.addEventListener('click', function(e) {
          e.stopPropagation();
          togglePanel();
        });
        DOM.panelHeader.addEventListener('click', togglePanel);

        function togglePanel() {
          const collapsed = DOM.controlPanel.classList.contains('collapsed');
          DOM.controlPanel.classList.toggle('collapsed', !collapsed);
          DOM.togglePanelBtn.textContent = collapsed ? '−' : '+';
          DOM.togglePanelBtn.title = collapsed ? '收合控制欄' : '展開控制欄';
        }

        if (window.matchMedia('(max-width: 700px)').matches) {
          DOM.controlPanel.classList.add('collapsed');
          DOM.togglePanelBtn.textContent = '+';
        }

        DOM.wmtsLayerSelect.addEventListener('change', function() {
          setWmtsLayer(this.value);
        });

        DOM.locationBtn.addEventListener('click', performLocation);

        DOM.fileInput.addEventListener('change', function(event) {
          if (event.target.files.length > 0) {
            handleKmlFiles(event.target.files);
          }
        });

        DOM.autoSaveCheckbox.addEventListener('change', async function() {
          setAutoSaveEnabled(this.checked);
          if (this.checked) {
            await saveCurrentMapState();
            setStatus('已啟用自動記錄。');
          } else {
            try {
              await dbDelete(CONFIG.STATE_KEY);
              setStatus('已關閉自動記錄並清除之前保存的資料。');
            } catch (error) {
              console.warn(error);
            }
          }
        });

        DOM.clearAllBtn.addEventListener('click', async function() {
          if (AppState.kmlLayers.length === 0) {
            alert('目前沒有已載入的 KML 圖層。');
            return;
          }
          if (!confirm('確定要清除目前所有 KML 圖層嗎？\n\n下次開啟網頁時，這些 KML 不會再自動還原。')) return;

          clearCurrentKmlLayers();
          if (DOM.autoSaveCheckbox.checked) {
            await saveCurrentMapState();
          } else {
            await dbDelete(CONFIG.STATE_KEY);
          }
          setStatus('已清除目前 KML 圖層。');
        });

        DOM.clearSavedDataBtn.addEventListener('click', async function() {
          if (!confirm(
            '確定要清除快取資料嗎？\n\n將清除：\n' +
            '• 上次選擇的 WMTS 底圖\n' +
            '• 上次載入的 KML\n' +
            '• KML 顯示狀態與圖層順序\n' +
            '• 地圖中心位置與縮放設定\n\n' +
            '不會刪除手機或電腦中的原始 KML 檔案。'
          )) return;

          try {
            AppState.isRestoring = true;
            clearTimeout(AppState.saveTimer);
            clearCurrentKmlLayers();
            await dbDelete(CONFIG.STATE_KEY);
            localStorage.removeItem(CONFIG.AUTO_SAVE_KEY);
            DOM.autoSaveCheckbox.checked = true;
            setStatus('已清除快取資料與之前載入的 KML。');
          } catch (error) {
            console.error(error);
            setStatus(`清除快取資料失敗：${error.message}`, 'error');
          } finally {
            AppState.isRestoring = false;
          }
        });
      }

      // ============================================================
      //  16. 應用程式初始化
      // ============================================================

      async function initApp() {
        try {
          AppState.isRestoring = true;

          createMap();
          await openDatabase();

          DOM.autoSaveCheckbox.checked = getAutoSaveEnabled();

          let savedState = null;
          if (DOM.autoSaveCheckbox.checked) {
            savedState = await dbGet(CONFIG.STATE_KEY);
          }

          const preferredLayer = savedState?.wmtsLayer || null;
          await loadWmtsCapabilities(preferredLayer);

          await restoreSavedMapState(savedState);

          bindEvents();

          if (AppState.kmlLayers.length === 0) {
            setStatus('地圖已就緒，可載入 KML 檔案。');
          }

        } catch (error) {
          console.error(error);
          setStatus(`初始化失敗：${error.message}`, 'error');
        } finally {
          AppState.isRestoring = false;
        }
      }

      // ============================================================
      //  17. 啟動
      // ============================================================

      if (typeof ol !== 'undefined') {
        initApp();
      } else {
        console.error('OpenLayers 未正確載入。');
        DOM.status.textContent = '❌ OpenLayers 載入失敗，請重新整理頁面。';
      }

    })();
  </script>

</body>
</html>
