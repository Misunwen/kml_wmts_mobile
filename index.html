<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>國土測繪中心 WMTS + KML/KMZ/GPX 地圖</title>

  <!-- 連線預熱：提前與 CDN 及 WMTS 建立連線，縮短行動網路首次載入 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com">
  <link rel="preconnect" href="https://wmts.nlsc.gov.tw" crossorigin>

  <!-- OpenLayers -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css">
  <script defer src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

  <!-- JSZip（用於解壓縮 KMZ） -->
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <!-- 應用程式樣式 -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="controlPanel">
    <div id="panelHeader">
      <div class="panelTitleWrap">
        <span id="panelTitle">KML/KMZ/GPX 地圖檢視器</span>
        <span id="appVersion"></span>
      </div>
      <div class="headerButtons">
        <button id="toggleSideBtn" type="button" title="切換面板至右側">⇄</button>
        <button id="togglePanelBtn" type="button" title="收合控制欄">−</button>
      </div>
    </div>

    <span id="status">地圖初始化中...</span>

    <div id="panelContent">
      <!-- WMTS -->
      <div class="sectionTitle">國土測繪中心 WMTS 底圖</div>
      <select id="wmtsLayerSelect" disabled>
        <option>正在讀取 WMTS 圖層清單...</option>
      </select>
      <div class="hint">WMTS 圖層清單由國土測繪中心 GetCapabilities 自動讀取。</div>

      <!-- 定位 -->
      <div class="sectionTitle">目前位置</div>
      <button id="locationBtn" type="button">📍 定位到我的位置</button>
      <div class="hint">第一次使用時請允許瀏覽器使用位置資訊。</div>

      <!-- 載入檔案 -->
      <div class="sectionTitle">載入 GIS 檔案</div>
      <input id="fileInput" type="file" multiple accept=".kml,.kmz,.gpx,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/gpx+xml">
      <div class="hint">
        支援格式：<span class="formatBadge kml">KML</span>
        <span class="formatBadge kmz">KMZ</span>
        <span class="formatBadge gpx">GPX</span>
        <br>最多同時載入 10 個檔案。所有檔案僅在本機瀏覽器讀取，不會上傳。
      </div>

      <!-- 進度條 -->
      <div id="progressContainer">
        <div id="progressText">準備載入...</div>
        <div id="progressBarWrapper">
          <div id="progressBar" style="width:0%"></div>
        </div>
      </div>

      <!-- 自動記錄 -->
      <div class="sectionTitle">自動記錄</div>
      <label class="autoSaveRow">
        <input id="autoSaveCheckbox" type="checkbox" checked>
        <span>記住底圖、圖層、順序與地圖位置</span>
      </label>
      <div class="hint">記錄資料保存在目前裝置瀏覽器的 IndexedDB。</div>

      <!-- 圖層清單 -->
      <div class="sectionTitle">我的圖層</div>
      <div id="layerList">
        <div style="color:#666; font-size:14px;">尚未載入任何檔案。</div>
      </div>

      <div class="hint">清除快取不會刪除手機或電腦中的原始檔案。</div>
      <div class="clearButtons">
        <button id="clearAllBtn" type="button">清除所有圖層</button>
        <button id="clearSavedDataBtn" type="button">清除快取資料</button>
      </div>
    </div>
  </div>

  <div id="map"></div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
