<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>國土測繪中心 WMTS + KML 地圖</title>

  <!-- OpenLayers -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
  >

  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8eef2;
    }

    /* 左上控制面板 */
    #controlPanel {
      position: absolute;
      z-index: 1000;

      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));

      width: 430px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);

      overflow: hidden;
      box-sizing: border-box;

      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.30);
    }

    #panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 45px;
      padding: 8px 10px 8px 13px;
      box-sizing: border-box;

      color: white;
      background: #1f5f99;

      cursor: pointer;
      user-select: none;
    }

    #panelTitle {
      font-size: 16px;
      font-weight: bold;
    }

    #togglePanelBtn {
      width: 34px;
      min-width: 34px;
      height: 30px;
      padding: 0;

      color: white;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.70);
      border-radius: 5px;

      font-size: 20px;
      line-height: 24px;
      cursor: pointer;
    }

    #panelContent {
      max-height: calc(100vh - 75px);
      padding: 10px 12px 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #controlPanel.collapsed #panelContent {
      display: none;
    }

    .sectionTitle {
      margin: 10px 0 6px;
      padding-top: 10px;
      border-top: 1px solid #dddddd;

      font-size: 14px;
      font-weight: bold;
    }

    .sectionTitle:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    select,
    input[type="file"],
    button {
      max-width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 15px;
    }

    select,
    input[type="file"] {
      width: 100%;
      margin-top: 5px;
    }

    button {
      padding: 7px 10px;

      color: #222;
      background: #fafafa;
      border: 1px solid #a9a9a9;
      border-radius: 5px;

      cursor: pointer;
    }

    button:hover {
      background: #eeeeee;
    }

    button:active {
      background: #dddddd;
    }

    button:disabled {
      color: #777;
      background: #dddddd;
      cursor: not-allowed;
    }

    #locationBtn {
      width: 100%;
      margin-top: 5px;

      color: white;
      background: #26743b;
      border-color: #1b5a2d;
      font-weight: bold;
    }

    #locationBtn:hover {
      background: #1e6130;
    }

    #clearAllBtn,
    #clearSavedDataBtn {
      width: 100%;
      margin-top: 7px;
    }

    #clearSavedDataBtn {
      color: #9b1d1d;
      background: #fff6f6;
      border-color: #d5a4a4;
    }

    #clearSavedDataBtn:hover {
      background: #ffe7e7;
    }

    .hint {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .autoSaveRow {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 5px;
      padding: 7px 8px;

      border: 1px solid #d6e2ec;
      border-radius: 5px;
      background: #f5faff;

      cursor: pointer;
      user-select: none;
    }

    .autoSaveRow input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    #layerList {
      margin-top: 7px;
    }

    .layerItem {
      display: flex;
      align-items: center;
      gap: 4px;

      min-height: 38px;
      padding: 5px 2px;
      border-bottom: 1px solid #e7e7e7;

      font-size: 14px;
    }

    .layerItem input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    .layerName {
      flex: 1;
      min-width: 70px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layerItem button {
      min-width: 30px;
      padding: 4px 6px;
      font-size: 12px;
    }

    .layerMoveBtn {
      min-width: 28px !important;
      padding: 4px 6px !important;
      font-size: 16px !important;
      font-weight: bold;
      line-height: 1;
    }

    .layerMoveBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    #status {
      display: block;

      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #dddddd;

      color: #333;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* 手機版 */
    @media (max-width: 700px) {
      #controlPanel {
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));

        width: calc(100vw - 12px);
        max-width: none;
        max-height: calc(100vh - 12px);

        border-radius: 8px;
      }

      #panelHeader {
        min-height: 42px;
      }

      #panelTitle {
        font-size: 15px;
      }

      #panelContent {
        max-height: calc(100vh - 62px);
        padding-bottom: 22px;
      }

      select,
      input[type="file"],
      button {
        font-size: 16px;
      }

      .layerItem {
        min-height: 42px;
      }

      .layerItem button {
        min-width: 34px;
        padding: 6px 7px;
        font-size: 13px;
      }

      .layerMoveBtn {
        min-width: 32px !important;
        font-size: 17px !important;
      }
    }
  </style>
</head>

<body>

  <div id="controlPanel">

    <div id="panelHeader">
      <span id="panelTitle">KML 圖層與測繪中心底圖</span>

      <button
        id="togglePanelBtn"
        type="button"
        title="收合控制欄"
      >
        −
      </button>
    </div>

    <div id="panelContent">

      <div class="sectionTitle">國土測繪中心 WMTS 底圖</div>

      <select id="wmtsLayerSelect" disabled>
        <option>正在讀取 WMTS 圖層清單...</option>
      </select>

      <div class="hint">
        WMTS 圖層清單由國土測繪中心 GetCapabilities 自動讀取。
      </div>

      <div class="sectionTitle">目前位置</div>

      <button id="locationBtn" type="button">
        📍 定位到我的位置
      </button>

      <div class="hint">
        第一次使用時請允許瀏覽器使用位置資訊。
      </div>

      <div class="sectionTitle">載入本機 KML</div>

      <input
        id="fileInput"
        type="file"
        multiple
        accept=".kml,application/vnd.google-earth.kml+xml"
      >

      <div class="hint">
        最多同時載入 10 個 KML。<br>
        KML 僅在本機瀏覽器讀取，不會上傳 GitHub。
      </div>

      <div class="sectionTitle">自動記錄</div>

      <label class="autoSaveRow">
        <input id="autoSaveCheckbox" type="checkbox" checked>
        <span>記住底圖、KML、圖層順序與地圖位置</span>
      </label>

      <div class="hint">
        記錄資料保存在目前裝置瀏覽器的 IndexedDB。
      </div>

      <div class="sectionTitle">我的 KML 圖層</div>

      <div id="layerList">
        <div style="color:#666; font-size:14px;">
          尚未載入 KML。
        </div>
      </div>

      <button id="clearAllBtn" type="button">
        清除目前 KML 圖層
      </button>

      <button id="clearSavedDataBtn" type="button">
        清除快取資料與之前載入的 KML
      </button>

      <div class="hint">
        清除快取不會刪除手機或電腦中的原始 KML 檔案。
      </div>

      <span id="status">地圖初始化中...</span>

    </div>
  </div>

  <div id="map"></div>

  <script>
    "use strict";

    /* 國土測繪中心新版 HTTPS WMTS */
    const WMTS_URL = "https://wmts.nlsc.gov.tw/wmts";

    /* 最多 KML 圖層數 */
    const MAX_KML_LAYERS = 10;

    /* IndexedDB 設定 */
    const DB_NAME = "nlsc-kml-map-db";
    const DB_VERSION = 1;
    const STORE_NAME = "mapState";
    const STATE_KEY = "lastMapState";

    /* localStorage：記住自動記錄是否啟用 */
    const AUTO_SAVE_KEY = "nlsc-kml-map-auto-save";

    /* DOM */
    const controlPanel = document.getElementById("controlPanel");
    const panelHeader = document.getElementById("panelHeader");
    const togglePanelBtn = document.getElementById("togglePanelBtn");

    const wmtsLayerSelect = document.getElementById("wmtsLayerSelect");
    const locationBtn = document.getElementById("locationBtn");

    const fileInput = document.getElementById("fileInput");
    const autoSaveCheckbox = document.getElementById("autoSaveCheckbox");

    const layerListEl = document.getElementById("layerList");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const clearSavedDataBtn = document.getElementById("clearSavedDataBtn");

    const statusEl = document.getElementById("status");

    /* 全域變數 */
    let database = null;
    let wmtsCapabilities = null;
    let wmtsLayer = null;
    let userLocationLayer = null;

    let kmlLayers = [];
    let nextLayerId = 1;

    let isRestoringSavedState = false;
    let saveTimer = null;

    /* 建立地圖 */
    const map = new ol.Map({
      target: "map",

      layers: [],

      view: new ol.View({
        projection: "EPSG:3857",
        center: ol.proj.fromLonLat([120.9, 23.7]),
        zoom: 7,
        minZoom: 5,
        maxZoom: 20
      })
    });

    /* =====================================================
       控制欄收合 / 展開
       ===================================================== */

    function setPanelCollapsed(collapsed) {
      controlPanel.classList.toggle("collapsed", collapsed);

      togglePanelBtn.textContent = collapsed ? "+" : "−";
      togglePanelBtn.title = collapsed
        ? "展開控制欄"
        : "收合控制欄";
    }

    function applyInitialPanelMode() {
      const isMobile = window.matchMedia("(max-width: 700px)").matches;

      /* 手機預設收合，桌機預設展開 */
      setPanelCollapsed(isMobile);
    }

    togglePanelBtn.addEventListener("click", function (event) {
      event.stopPropagation();

      const collapsed = controlPanel.classList.contains("collapsed");
      setPanelCollapsed(!collapsed);
    });

    panelHeader.addEventListener("click", function () {
      const collapsed = controlPanel.classList.contains("collapsed");
      setPanelCollapsed(!collapsed);
    });

    applyInitialPanelMode();

    /* =====================================================
       IndexedDB
       ===================================================== */

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function (event) {
          const db = event.target.result;

          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };

        request.onsuccess = function (event) {
          database = event.target.result;
          resolve(database);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function dbGet(key) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(key);

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function dbSet(key, value) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);

        store.put(value, key);

        transaction.oncomplete = function () {
          resolve();
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    function dbDelete(key) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);

        store.delete(key);

        transaction.oncomplete = function () {
          resolve();
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    /* =====================================================
       自動記錄
       ===================================================== */

    function getAutoSaveEnabled() {
      const value = localStorage.getItem(AUTO_SAVE_KEY);

      /* 第一次使用預設啟用 */
      if (value === null) {
        return true;
      }

      return value === "true";
    }

    function setAutoSaveEnabled(enabled) {
      localStorage.setItem(AUTO_SAVE_KEY, enabled ? "true" : "false");
    }

    autoSaveCheckbox.checked = getAutoSaveEnabled();

    function getCurrentMapState() {
      const view = map.getView();

      return {
        savedAt: new Date().toISOString(),

        wmtsLayer: wmtsLayerSelect.value || null,

        view: {
          center: view.getCenter() || null,
          zoom: view.getZoom() || 7,
          rotation: view.getRotation() || 0
        },

        /*
          kmlLayers 陣列順序：
          index 0：最下層
          最後一個：最上層
        */
        kmlLayers: kmlLayers.map(layerData => ({
          name: layerData.name,
          text: layerData.text,
          visible: layerData.layer.getVisible()
        }))
      };
    }

    async function saveCurrentMapState() {
      if (!database) {
        return;
      }

      if (!autoSaveCheckbox.checked) {
        return;
      }

      if (isRestoringSavedState) {
        return;
      }

      try {
        const state = getCurrentMapState();
        await dbSet(STATE_KEY, state);

      } catch (error) {
        console.warn("儲存資料失敗：", error);

        if (error.name === "QuotaExceededError") {
          statusEl.textContent =
            "KML 太大，瀏覽器儲存空間不足，無法自動記錄。";
        }
      }
    }

    function scheduleSaveMapState() {
      if (!autoSaveCheckbox.checked) {
        return;
      }

      if (isRestoringSavedState) {
        return;
      }

      clearTimeout(saveTimer);

      saveTimer = setTimeout(function () {
        saveCurrentMapState();
      }, 700);
    }

    map.on("moveend", function () {
      scheduleSaveMapState();
    });

    autoSaveCheckbox.addEventListener("change", async function () {
      setAutoSaveEnabled(this.checked);

      if (this.checked) {
        await saveCurrentMapState();

        statusEl.textContent = "已啟用自動記錄。";

      } else {
        try {
          await dbDelete(STATE_KEY);

          statusEl.textContent =
            "已關閉自動記錄並清除之前保存的資料。";

        } catch (error) {
          console.warn(error);
        }
      }
    });

    /* =====================================================
       WMTS
       ===================================================== */

    async function loadWmtsCapabilities(preferredLayerName = null) {
      try {
        statusEl.textContent = "正在讀取 WMTS 圖層清單...";

        const capabilitiesUrl =
          WMTS_URL +
          "?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0";

        const response = await fetch(capabilitiesUrl);

        if (!response.ok) {
          throw new Error("WMTS 回應錯誤，HTTP " + response.status);
        }

        const xmlText = await response.text();

        const parser = new ol.format.WMTSCapabilities();
        wmtsCapabilities = parser.read(xmlText);

        const layers = wmtsCapabilities?.Contents?.Layer;

        if (!layers || layers.length === 0) {
          throw new Error("WMTS 沒有回傳可用圖層。");
        }

        wmtsLayerSelect.innerHTML = "";

        layers.forEach(layerInfo => {
          const option = document.createElement("option");

          option.value = layerInfo.Identifier;
          option.textContent =
            layerInfo.Title ||
            layerInfo.Identifier;

          wmtsLayerSelect.appendChild(option);
        });

        wmtsLayerSelect.disabled = false;

        const availableLayerNames = Array.from(
          wmtsLayerSelect.options
        ).map(option => option.value);

        let selectedLayerName = null;

        /* 優先使用上次選擇的圖層 */
        if (
          preferredLayerName &&
          availableLayerNames.includes(preferredLayerName)
        ) {
          selectedLayerName = preferredLayerName;

        /* 否則優先 EMAP */
        } else if (availableLayerNames.includes("EMAP")) {
          selectedLayerName = "EMAP";

        /* 若沒有 EMAP，使用第一個 */
        } else {
          selectedLayerName = layers[0].Identifier;
        }

        wmtsLayerSelect.value = selectedLayerName;
        setWmtsLayer(selectedLayerName);

        statusEl.textContent =
          "WMTS 圖層清單讀取完成，共 " +
          layers.length +
          " 個圖層。";

      } catch (error) {
        console.error(error);

        statusEl.innerHTML =
          "<b>WMTS 圖層清單讀取失敗。</b><br>" +
          "錯誤：" + escapeHtml(error.message) +
          "<br><br>" +
          "<small>請確認此網址是否可開啟：<br>" +
          escapeHtml(
            WMTS_URL +
            "?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0"
          ) +
          "</small>";
      }
    }

    function setWmtsLayer(layerName) {
      try {
        if (!wmtsCapabilities) {
          return;
        }

        const options = ol.source.WMTS.optionsFromCapabilities(
          wmtsCapabilities,
          {
            layer: layerName,
            projection: "EPSG:3857"
          }
        );

        if (!options) {
          throw new Error(
            "找不到 EPSG:3857 / GoogleMapsCompatible 設定：" +
            layerName
          );
        }

        const newWmtsLayer = new ol.layer.Tile({
          source: new ol.source.WMTS(options),
          zIndex: 0
        });

        if (wmtsLayer) {
          map.removeLayer(wmtsLayer);
        }

        wmtsLayer = newWmtsLayer;

        /* 底圖固定在最底層 */
        map.getLayers().insertAt(0, wmtsLayer);

        statusEl.textContent = "已切換底圖：" + layerName;

        scheduleSaveMapState();

      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "WMTS 底圖載入失敗：" + error.message;
      }
    }

    wmtsLayerSelect.addEventListener("change", function () {
      setWmtsLayer(this.value);
    });

    /* =====================================================
       KML 圖層
       ===================================================== */

    function updateKmlLayerZIndex() {
      /*
        kmlLayers[0]：最下方
        kmlLayers最後一個：最上方
      */
      kmlLayers.forEach((layerData, index) => {
        layerData.layer.setZIndex(10 + index);
      });
    }

    function moveKmlLayer(id, direction) {
      const currentIndex = kmlLayers.findIndex(item => item.id === id);

      if (currentIndex === -1) {
        return;
      }

      const targetIndex = currentIndex + direction;

      /* 已經是最上層或最下層 */
      if (targetIndex < 0 || targetIndex >= kmlLayers.length) {
        return;
      }

      const temporaryLayer = kmlLayers[currentIndex];

      kmlLayers[currentIndex] = kmlLayers[targetIndex];
      kmlLayers[targetIndex] = temporaryLayer;

      updateKmlLayerZIndex();
      renderLayerList();
      scheduleSaveMapState();

      statusEl.textContent =
        "已調整圖層順序：" + temporaryLayer.name;
    }

    fileInput.addEventListener("change", async function (event) {
      const files = Array.from(event.target.files);

      if (files.length === 0) {
        return;
      }

      const remainingCount = MAX_KML_LAYERS - kmlLayers.length;

      if (remainingCount <= 0) {
        alert(
          "目前最多只能同時載入 " +
          MAX_KML_LAYERS +
          " 個 KML 圖層。"
        );

        fileInput.value = "";
        return;
      }

      let loadFiles = files;

      if (files.length > remainingCount) {
        alert(
          "目前還可載入 " +
          remainingCount +
          " 個 KML，超出的檔案不會載入。"
        );

        loadFiles = files.slice(0, remainingCount);
      }

      for (const file of loadFiles) {
        await loadKmlFile(file);
      }

      fileInput.value = "";
    });

    function loadKmlFile(file) {
      return new Promise(resolve => {
        const lowerName = file.name.toLowerCase();

        if (!lowerName.endsWith(".kml")) {
          alert(file.name + " 不是 KML 檔案，已略過。");
          resolve();
          return;
        }

        statusEl.textContent = "正在讀取 KML：" + file.name;

        const reader = new FileReader();

        reader.onload = function (event) {
          try {
            const kmlText = event.target.result;
            const isFirstLayer = kmlLayers.length === 0;

            const layerData = createKmlLayerFromText(
              file.name,
              kmlText,
              true,
              isFirstLayer,
              true
            );

            statusEl.textContent =
              "已載入 KML：" +
              file.name +
              "，共 " +
              layerData.source.getFeatures().length +
              " 個圖徵。";

          } catch (error) {
            console.error(error);

            alert(
              file.name +
              " 讀取失敗：" +
              error.message
            );
          }

          resolve();
        };

        reader.onerror = function () {
          alert(file.name + " 檔案讀取失敗。");
          resolve();
        };

        reader.readAsText(file, "UTF-8");
      });
    }

    function createKmlLayerFromText(
      fileName,
      kmlText,
      visible = true,
      autoZoom = false,
      shouldSave = true
    ) {
      const kmlFormat = new ol.format.KML({
        extractStyles: true,
        showPointNames: false
      });

      const features = kmlFormat.readFeatures(kmlText, {
        dataProjection: "EPSG:4326",
        featureProjection: "EPSG:3857"
      });

      if (!features || features.length === 0) {
        throw new Error("沒有讀到可用的點、線或面圖徵。");
      }

      const source = new ol.source.Vector({
        features: features
      });

      const vectorLayer = new ol.layer.Vector({
        source: source,
        visible: visible,
        zIndex: 10 + kmlLayers.length
      });

      const layerData = {
        id: nextLayerId++,
        name: fileName,
        text: kmlText,
        layer: vectorLayer,
        source: source
      };

      map.addLayer(vectorLayer);
      kmlLayers.push(layerData);

      updateKmlLayerZIndex();
      renderLayerList();

      if (autoZoom) {
        zoomToLayer(layerData);
      }

      if (shouldSave) {
        scheduleSaveMapState();
      }

      return layerData;
    }

    function renderLayerList() {
      layerListEl.innerHTML = "";

      if (kmlLayers.length === 0) {
        layerListEl.innerHTML =
          '<div style="color:#666; font-size:14px;">尚未載入 KML。</div>';

        return;
      }

      /*
        陣列第 0 個圖層是最下層，
        最後一個圖層是最上層。
      */
      kmlLayers.forEach((layerData, index) => {
        const row = document.createElement("div");
        row.className = "layerItem";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = layerData.layer.getVisible();
        checkbox.title = "顯示或隱藏圖層";

        checkbox.addEventListener("change", function () {
          layerData.layer.setVisible(this.checked);
          scheduleSaveMapState();
        });

        const name = document.createElement("span");
        name.className = "layerName";

        /*
          [1] 是最下層。
          數字越大，位置越上層。
        */
        const displayOrder = index + 1;

        name.textContent =
          "[" + displayOrder + "] " + layerData.name;

        name.title =
          layerData.name +
          "（圖層順序：" +
          displayOrder +
          "，數字越大越上方）";

        const moveUpButton = document.createElement("button");
        moveUpButton.type = "button";
        moveUpButton.textContent = "↑";
        moveUpButton.className = "layerMoveBtn";
        moveUpButton.title = "圖層往上移";

        /*
          最後一個是最上層，不可再上移。
        */
        moveUpButton.disabled = index === kmlLayers.length - 1;

        moveUpButton.addEventListener("click", function () {
          moveKmlLayer(layerData.id, +1);
        });

        const moveDownButton = document.createElement("button");
        moveDownButton.type = "button";
        moveDownButton.textContent = "↓";
        moveDownButton.className = "layerMoveBtn";
        moveDownButton.title = "圖層往下移";

        /*
          第一個是最下層，不可再下移。
        */
        moveDownButton.disabled = index === 0;

        moveDownButton.addEventListener("click", function () {
          moveKmlLayer(layerData.id, -1);
        });

        const zoomButton = document.createElement("button");
        zoomButton.type = "button";
        zoomButton.textContent = "定位";
        zoomButton.title = "縮放至此圖層範圍";

        zoomButton.addEventListener("click", function () {
          zoomToLayer(layerData);
        });

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "移除";
        removeButton.title = "移除此 KML 圖層";

        removeButton.addEventListener("click", function () {
          removeKmlLayer(layerData.id);
        });

        row.appendChild(checkbox);
        row.appendChild(name);
        row.appendChild(moveUpButton);
        row.appendChild(moveDownButton);
        row.appendChild(zoomButton);
        row.appendChild(removeButton);

        layerListEl.appendChild(row);
      });
    }

    function zoomToLayer(layerData) {
      const extent = layerData.source.getExtent();

      if (ol.extent.isEmpty(extent)) {
        alert("此圖層沒有可定位的範圍。");
        return;
      }

      map.getView().fit(extent, {
        padding: [90, 30, 30, 30],
        maxZoom: 18,
        duration: 500
      });
    }

    function removeKmlLayer(id) {
      const index = kmlLayers.findIndex(item => item.id === id);

      if (index === -1) {
        return;
      }

      const layerData = kmlLayers[index];

      map.removeLayer(layerData.layer);
      kmlLayers.splice(index, 1);

      updateKmlLayerZIndex();
      renderLayerList();
      scheduleSaveMapState();

      statusEl.textContent =
        "已移除圖層：" + layerData.name;
    }

    function clearCurrentKmlLayers() {
      kmlLayers.forEach(layerData => {
        map.removeLayer(layerData.layer);
      });

      kmlLayers = [];

      updateKmlLayerZIndex();
      renderLayerList();
    }

    clearAllBtn.addEventListener("click", async function () {
      if (kmlLayers.length === 0) {
        alert("目前沒有已載入的 KML 圖層。");
        return;
      }

      const confirmed = confirm(
        "確定要清除目前所有 KML 圖層嗎？\n\n" +
        "下次開啟網頁時，這些 KML 不會再自動還原。"
      );

      if (!confirmed) {
        return;
      }

      clearCurrentKmlLayers();

      /*
        若啟用自動儲存則保存空白圖層狀態。
        若未啟用，則直接移除之前記錄。
      */
      if (autoSaveCheckbox.checked) {
        await saveCurrentMapState();
      } else {
        await dbDelete(STATE_KEY);
      }

      statusEl.textContent =
        "已清除目前 KML 圖層。";
    });

    clearSavedDataBtn.addEventListener("click", async function () {
      const confirmed = confirm(
        "確定要清除快取資料嗎？\n\n" +
        "將清除：\n" +
        "• 上次選擇的 WMTS 底圖\n" +
        "• 上次載入的 KML\n" +
        "• KML 顯示狀態與圖層順序\n" +
        "• 地圖中心位置與縮放設定\n\n" +
        "不會刪除手機或電腦中的原始 KML 檔案。"
      );

      if (!confirmed) {
        return;
      }

      try {
        isRestoringSavedState = true;

        clearTimeout(saveTimer);

        /* 移除目前畫面上的 KML */
        clearCurrentKmlLayers();

        /* 刪除 IndexedDB 內保存的資料 */
        await dbDelete(STATE_KEY);

        /*
          自動記錄恢復為預設啟用狀態，
          但目前沒有任何 KML 保存資料。
        */
        localStorage.removeItem(AUTO_SAVE_KEY);
        autoSaveCheckbox.checked = true;

        statusEl.textContent =
          "已清除快取資料與之前載入的 KML。";

      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "清除快取資料失敗：" + error.message;

      } finally {
        isRestoringSavedState = false;
      }
    });

    /* =====================================================
       GPS 定位
       ===================================================== */

    locationBtn.addEventListener("click", function () {
      if (!navigator.geolocation) {
        alert("此瀏覽器不支援定位功能。");
        return;
      }

      locationBtn.disabled = true;
      locationBtn.textContent = "正在定位...";

      statusEl.textContent =
        "正在要求定位權限與取得目前位置...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const longitude = position.coords.longitude;
          const latitude = position.coords.latitude;
          const accuracy = position.coords.accuracy;

          const coordinate = ol.proj.fromLonLat([
            longitude,
            latitude
          ]);

          showUserLocation(coordinate, accuracy);

          map.getView().animate({
            center: coordinate,
            zoom: 17,
            duration: 600
          });

          locationBtn.disabled = false;
          locationBtn.textContent = "📍 定位到我的位置";

          statusEl.textContent =
            "定位完成。經度：" +
            longitude.toFixed(6) +
            "，緯度：" +
            latitude.toFixed(6) +
            "，誤差約 ±" +
            Math.round(accuracy) +
            " 公尺。";
        },

        function (error) {
          locationBtn.disabled = false;
          locationBtn.textContent = "📍 定位到我的位置";

          let message = "定位失敗。";

          switch (error.code) {
            case error.PERMISSION_DENIED:
              message =
                "定位被拒絕。請在瀏覽器網站權限中允許位置資訊。";
              break;

            case error.POSITION_UNAVAILABLE:
              message =
                "目前無法取得位置，請確認 GPS、行動網路或 Wi-Fi 已啟用。";
              break;

            case error.TIMEOUT:
              message =
                "定位逾時，請到戶外或訊號較佳的位置後再試一次。";
              break;
          }

          statusEl.textContent = message;
          alert(message);
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }
      );
    });

    function showUserLocation(coordinate, accuracy) {
      if (userLocationLayer) {
        map.removeLayer(userLocationLayer);
      }

      const locationFeature = new ol.Feature({
        geometry: new ol.geom.Point(coordinate)
      });

      const accuracyFeature = new ol.Feature({
        geometry: new ol.geom.Circle(coordinate, accuracy)
      });

      userLocationLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          features: [
            accuracyFeature,
            locationFeature
          ]
        }),

        zIndex: 999,

        style: function (feature) {
          const geometryType = feature.getGeometry().getType();

          if (geometryType === "Circle") {
            return new ol.style.Style({
              fill: new ol.style.Fill({
                color: "rgba(30, 120, 255, 0.13)"
              }),

              stroke: new ol.style.Stroke({
                color: "rgba(30, 120, 255, 0.75)",
                width: 2
              })
            });
          }

          return new ol.style.Style({
            image: new ol.style.Circle({
              radius: 8,

              fill: new ol.style.Fill({
                color: "#1677ff"
              }),

              stroke: new ol.style.Stroke({
                color: "#ffffff",
                width: 3
              })
            })
          });
        }
      });

      map.addLayer(userLocationLayer);
    }

    /* =====================================================
       還原資料
       ===================================================== */

    async function restoreSavedMapState(savedState) {
      if (!savedState) {
        return;
      }

      if (!autoSaveCheckbox.checked) {
        return;
      }

      try {
        isRestoringSavedState = true;

        if (Array.isArray(savedState.kmlLayers)) {
          const restoreLayers = savedState.kmlLayers.slice(
            0,
            MAX_KML_LAYERS
          );

          for (const savedLayer of restoreLayers) {
            try {
              if (!savedLayer.name || !savedLayer.text) {
                continue;
              }

              createKmlLayerFromText(
                savedLayer.name,
                savedLayer.text,
                savedLayer.visible !== false,
                false,
                false
              );

            } catch (error) {
              console.warn(
                "無法還原 KML：" + savedLayer.name,
                error
              );
            }
          }
        }

        /*
          優先還原地圖位置。
          若沒有保存地圖位置，則縮放到第一個 KML。
        */
        if (
          savedState.view &&
          Array.isArray(savedState.view.center) &&
          savedState.view.center.length === 2
        ) {
          map.getView().setCenter(savedState.view.center);
          map.getView().setZoom(savedState.view.zoom || 7);

          if (typeof savedState.view.rotation === "number") {
            map.getView().setRotation(savedState.view.rotation);
          }

        } else if (kmlLayers.length > 0) {
          zoomToLayer(kmlLayers[0]);
        }

        if (kmlLayers.length > 0) {
          statusEl.textContent =
            "已還原 " +
            kmlLayers.length +
            " 個 KML 圖層。";
        }

      } catch (error) {
        console.warn("還原資料失敗：", error);

      } finally {
        isRestoringSavedState = false;
      }
    }

    /* =====================================================
       工具函式
       ===================================================== */

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value);
      return div.innerHTML;
    }

    /* =====================================================
       初始化
       ===================================================== */

    async function initializeApp() {
      try {
        isRestoringSavedState = true;

        await openDatabase();

        let savedState = null;

        if (autoSaveCheckbox.checked) {
          savedState = await dbGet(STATE_KEY);
        }

        const preferredLayerName =
          savedState?.wmtsLayer || null;

        await loadWmtsCapabilities(preferredLayerName);

        await restoreSavedMapState(savedState);

      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "初始化失敗：" + error.message;

      } finally {
        isRestoringSavedState = false;
      }
    }

    initializeApp();
  </script>
