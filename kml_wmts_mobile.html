<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>國土測繪中心 WMTS + KML 地圖</title>

  <!-- OpenLayers -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/ol@10.6.1/ol.css"
  >
  <script src="https://cdn.jsdelivr.net/npm/ol@10.6.1/dist/ol.js"></script>

  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, "Microsoft JhengHei", sans-serif;
    }

    #map {
      width: 100%;
      height: 100%;
      background: #e8eef2;
    }

    /* 左上控制面板 */
    #controlPanel {
      position: absolute;
      z-index: 1000;
      top: max(10px, env(safe-area-inset-top));
      left: max(10px, env(safe-area-inset-left));

      width: 410px;
      max-width: calc(100vw - 20px);
      max-height: calc(100vh - 20px);

      overflow: hidden;
      box-sizing: border-box;

      border-radius: 10px;
      background: rgba(255, 255, 255, 0.97);
      box-shadow: 0 2px 15px rgba(0, 0, 0, 0.30);
    }

    #panelHeader {
      display: flex;
      align-items: center;
      justify-content: space-between;

      min-height: 45px;
      padding: 8px 10px 8px 13px;
      box-sizing: border-box;

      color: #ffffff;
      background: #1f5f99;

      cursor: pointer;
      user-select: none;
    }

    #panelTitle {
      font-size: 16px;
      font-weight: bold;
    }

    #togglePanelBtn {
      width: 34px;
      min-width: 34px;
      height: 30px;
      padding: 0;

      color: white;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 5px;

      font-size: 20px;
      line-height: 24px;
      cursor: pointer;
    }

    #panelContent {
      max-height: calc(100vh - 75px);
      padding: 10px 12px 15px;
      overflow-y: auto;
      box-sizing: border-box;
    }

    #controlPanel.collapsed #panelContent {
      display: none;
    }

    .sectionTitle {
      margin: 10px 0 6px;
      padding-top: 10px;
      border-top: 1px solid #dddddd;

      font-size: 14px;
      font-weight: bold;
    }

    .sectionTitle:first-child {
      margin-top: 0;
      padding-top: 0;
      border-top: none;
    }

    select,
    input[type="file"],
    button {
      max-width: 100%;
      box-sizing: border-box;
      font-family: inherit;
      font-size: 15px;
    }

    select,
    input[type="file"] {
      width: 100%;
      margin-top: 5px;
    }

    button {
      padding: 7px 10px;
      color: #222;
      background: #fafafa;
      border: 1px solid #a9a9a9;
      border-radius: 5px;
      cursor: pointer;
    }

    button:hover {
      background: #eeeeee;
    }

    button:active {
      background: #dddddd;
    }

    button:disabled {
      color: #777;
      background: #dddddd;
      cursor: not-allowed;
    }

    #locationBtn {
      width: 100%;
      margin-top: 5px;

      color: white;
      background: #26743b;
      border-color: #1b5a2d;
      font-weight: bold;
    }

    #locationBtn:hover {
      background: #1f6231;
    }

    #clearAllBtn,
    #clearSavedDataBtn {
      width: 100%;
      margin-top: 7px;
    }

    #clearSavedDataBtn {
      color: #9b1d1d;
      background: #fff6f6;
      border-color: #d5a4a4;
    }

    #clearSavedDataBtn:hover {
      background: #ffe9e9;
    }

    .hint {
      margin-top: 5px;
      color: #666;
      font-size: 12px;
      line-height: 1.5;
    }

    .autoSaveRow {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-top: 5px;
      padding: 7px 8px;

      border: 1px solid #d6e2ec;
      border-radius: 5px;
      background: #f5faff;

      cursor: pointer;
      user-select: none;
    }

    .autoSaveRow input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    #layerList {
      margin-top: 7px;
    }

    .layerItem {
      display: flex;
      align-items: center;
      gap: 5px;

      min-height: 34px;
      padding: 5px 2px;
      border-bottom: 1px solid #e7e7e7;

      font-size: 14px;
    }

    .layerItem input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
    }

    .layerName {
      flex: 1;
      min-width: 0;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .layerItem button {
      padding: 4px 6px;
      font-size: 12px;
    }

    #status {
      display: block;

      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid #dddddd;

      color: #333;
      font-size: 12px;
      line-height: 1.5;
      word-break: break-word;
    }

    /* 手機版 */
    @media (max-width: 700px) {
      #controlPanel {
        top: max(6px, env(safe-area-inset-top));
        left: max(6px, env(safe-area-inset-left));

        width: calc(100vw - 12px);
        max-width: none;
        max-height: calc(100vh - 12px);

        border-radius: 8px;
      }

      #panelHeader {
        min-height: 42px;
      }

      #panelTitle {
        font-size: 15px;
      }

      #panelContent {
        max-height: calc(100vh - 62px);
        padding-bottom: 22px;
      }

      select,
      input[type="file"],
      button {
        font-size: 16px;
      }

      .layerItem {
        min-height: 40px;
      }

      .layerItem button {
        padding: 6px 7px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <div id="controlPanel">
    <div id="panelHeader">
      <span id="panelTitle">KML 圖層與測繪中心底圖</span>

      <button
        id="togglePanelBtn"
        type="button"
        title="收合控制欄"
      >
        −
      </button>
    </div>

    <div id="panelContent">

      <div class="sectionTitle">國土測繪中心 WMTS 底圖</div>

      <select id="wmtsLayerSelect" disabled>
        <option>正在讀取 WMTS 圖層清單...</option>
      </select>

      <div class="hint">
        圖層清單由國土測繪中心 WMTS GetCapabilities 自動讀取。
      </div>

      <div class="sectionTitle">目前位置</div>

      <button id="locationBtn" type="button">
        📍 定位到我的位置
      </button>

      <div class="hint">
        第一次使用時，請允許瀏覽器取得位置權限。<br>
        GitHub Pages 使用 HTTPS，可支援手機 GPS 定位。
      </div>

      <div class="sectionTitle">載入本機 KML</div>

      <input
        id="fileInput"
        type="file"
        multiple
        accept=".kml,application/vnd.google-earth.kml+xml"
      >

      <div class="hint">
        最多同時載入 10 個 KML。<br>
        KML 僅在目前手機／電腦的瀏覽器內讀取，不會上傳。
      </div>

      <div class="sectionTitle">自動記錄</div>

      <label class="autoSaveRow">
        <input id="autoSaveCheckbox" type="checkbox" checked>
        <span>記住底圖、KML 圖層與地圖位置</span>
      </label>

      <div class="hint">
        記錄資料保存在目前瀏覽器的 IndexedDB，不會上傳 GitHub。
      </div>

      <div class="sectionTitle">我的 KML 圖層</div>

      <div id="layerList">
        <div style="color:#666; font-size:14px;">
          尚未載入 KML。
        </div>
      </div>

      <button id="clearAllBtn" type="button">
        清除目前 KML 圖層
      </button>

      <button id="clearSavedDataBtn" type="button">
        清除快取資料與之前載入的 KML
      </button>

      <div class="hint">
        「清除快取資料」只會刪除瀏覽器保存的內容，<br>
        不會刪除手機或電腦內原始的 KML 檔案。
      </div>

      <span id="status">地圖初始化中...</span>
    </div>
  </div>

  <div id="map"></div>

  <script>
    "use strict";

    /*
      國土測繪中心新版 WMTS。

      使用 GoogleMapsCompatible / EPSG:3857，
      適合一般 Web、手機與 GPS 地圖使用。
    */
    const WMTS_URL = "https://wmts.nlsc.gov.tw/wmts";

    /*
      最多同時載入 KML 圖層數。
    */
    const MAX_KML_LAYERS = 10;

    /*
      IndexedDB 設定。
    */
    const DB_NAME = "nlsc-kml-map-db";
    const DB_VERSION = 1;
    const STORE_NAME = "mapState";
    const STATE_KEY = "lastMapState";

    /*
      localStorage key：
      只記錄「使用者是否開啟自動記錄」。
    */
    const AUTO_SAVE_KEY = "nlsc-kml-map-auto-save";

    /* DOM */
    const controlPanel = document.getElementById("controlPanel");
    const panelHeader = document.getElementById("panelHeader");
    const togglePanelBtn = document.getElementById("togglePanelBtn");

    const wmtsLayerSelect = document.getElementById("wmtsLayerSelect");
    const locationBtn = document.getElementById("locationBtn");

    const fileInput = document.getElementById("fileInput");
    const autoSaveCheckbox = document.getElementById("autoSaveCheckbox");

    const layerListEl = document.getElementById("layerList");
    const clearAllBtn = document.getElementById("clearAllBtn");
    const clearSavedDataBtn = document.getElementById("clearSavedDataBtn");

    const statusEl = document.getElementById("status");

    /* 全域狀態 */
    let database = null;
    let wmtsCapabilities = null;
    let wmtsLayer = null;
    let userLocationLayer = null;

    let kmlLayers = [];
    let nextLayerId = 1;

    /*
      在初始化、還原資料時暫停自動儲存，
      避免預設底圖 EMAP 蓋掉上次的記錄。
    */
    let isRestoringSavedState = false;

    /*
      地圖移動時使用 debounce，
      避免每拖曳一下就寫入 IndexedDB。
    */
    let saveTimer = null;

    /*
      OpenLayers 地圖。
    */
    const map = new ol.Map({
      target: "map",
      layers: [],
      view: new ol.View({
        projection: "EPSG:3857",
        center: ol.proj.fromLonLat([120.9, 23.7]),
        zoom: 7,
        minZoom: 5,
        maxZoom: 20
      })
    });

    /* =========================================================
       控制面板收合／展開
       ========================================================= */

    function setPanelCollapsed(collapsed) {
      controlPanel.classList.toggle("collapsed", collapsed);

      togglePanelBtn.textContent = collapsed ? "+" : "−";
      togglePanelBtn.title = collapsed
        ? "展開控制欄"
        : "收合控制欄";
    }

    function applyInitialPanelMode() {
      const isMobile = window.matchMedia("(max-width: 700px)").matches;

      /*
        手機預設收合；
        電腦預設展開。
      */
      setPanelCollapsed(isMobile);
    }

    togglePanelBtn.addEventListener("click", function (event) {
      event.stopPropagation();

      const isCollapsed = controlPanel.classList.contains("collapsed");
      setPanelCollapsed(!isCollapsed);
    });

    panelHeader.addEventListener("click", function () {
      const isCollapsed = controlPanel.classList.contains("collapsed");
      setPanelCollapsed(!isCollapsed);
    });

    applyInitialPanelMode();

    /* =========================================================
       IndexedDB：瀏覽器本機儲存
       ========================================================= */

    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = function (event) {
          const db = event.target.result;

          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME);
          }
        };

        request.onsuccess = function (event) {
          database = event.target.result;
          resolve(database);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function dbGet(key) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.get(key);

        request.onsuccess = function () {
          resolve(request.result);
        };

        request.onerror = function () {
          reject(request.error);
        };
      });
    }

    function dbSet(key, value) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);

        store.put(value, key);

        transaction.oncomplete = function () {
          resolve();
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    function dbDelete(key) {
      return new Promise((resolve, reject) => {
        if (!database) {
          reject(new Error("IndexedDB 尚未初始化。"));
          return;
        }

        const transaction = database.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);

        store.delete(key);

        transaction.oncomplete = function () {
          resolve();
        };

        transaction.onerror = function () {
          reject(transaction.error);
        };
      });
    }

    /* =========================================================
       自動記錄設定
       ========================================================= */

    function getAutoSaveEnabled() {
      const savedValue = localStorage.getItem(AUTO_SAVE_KEY);

      /*
        第一次使用時，預設打勾。
      */
      if (savedValue === null) {
        return true;
      }

      return savedValue === "true";
    }

    function setAutoSaveEnabled(enabled) {
      localStorage.setItem(AUTO_SAVE_KEY, enabled ? "true" : "false");
    }

    autoSaveCheckbox.checked = getAutoSaveEnabled();

    /*
      建立目前地圖狀態物件。
    */
    function getCurrentMapState() {
      const view = map.getView();

      return {
        savedAt: new Date().toISOString(),

        /*
          WMTS 圖層代號，例如 EMAP、PHOTO2。
        */
        wmtsLayer: wmtsLayerSelect.value || null,

        /*
          地圖視圖狀態。
        */
        view: {
          center: view.getCenter() || null,
          zoom: view.getZoom() || 7,
          rotation: view.getRotation() || 0
        },

        /*
          KML 原始文字、檔名、是否顯示。
        */
        kmlLayers: kmlLayers.map(layerData => ({
          name: layerData.name,
          text: layerData.text,
          visible: layerData.layer.getVisible()
        }))
      };
    }

    async function saveCurrentMapState() {
      if (!database) {
        return;
      }

      if (!autoSaveCheckbox.checked) {
        return;
      }

      if (isRestoringSavedState) {
        return;
      }

      try {
        const state = getCurrentMapState();
        await dbSet(STATE_KEY, state);

      } catch (error) {
        console.warn("儲存地圖狀態失敗：", error);

        if (error.name === "QuotaExceededError") {
          statusEl.textContent =
            "KML 太大，瀏覽器本機儲存空間不足，無法自動記錄。";
        }
      }
    }

    function scheduleSaveMapState() {
      if (!autoSaveCheckbox.checked || isRestoringSavedState) {
        return;
      }

      clearTimeout(saveTimer);

      saveTimer = setTimeout(function () {
        saveCurrentMapState();
      }, 700);
    }

    /*
      地圖拖曳、縮放後記錄目前位置。
    */
    map.on("moveend", function () {
      scheduleSaveMapState();
    });

    autoSaveCheckbox.addEventListener("change", async function () {
      setAutoSaveEnabled(this.checked);

      if (this.checked) {
        await saveCurrentMapState();
        statusEl.textContent = "已啟用自動記錄。";

      } else {
        /*
          關閉自動記錄時，刪除先前保存資料，
          避免下次仍自動載入。
        */
        try {
          await dbDelete(STATE_KEY);
          statusEl.textContent = "已關閉自動記錄並清除已保存資料。";
        } catch (error) {
          console.warn(error);
        }
      }
    });

    /* =========================================================
       WMTS
       ========================================================= */

    async function loadWmtsCapabilities(preferredLayerName = null) {
      try {
        statusEl.textContent = "正在讀取測繪中心 WMTS 圖層清單...";

        const capabilitiesUrl =
          WMTS_URL +
          "?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0";

        const response = await fetch(capabilitiesUrl);

        if (!response.ok) {
          throw new Error("WMTS 回應錯誤，HTTP " + response.status);
        }

        const xmlText = await response.text();

        const parser = new ol.format.WMTSCapabilities();
        wmtsCapabilities = parser.read(xmlText);

        const layers = wmtsCapabilities?.Contents?.Layer;

        if (!layers || layers.length === 0) {
          throw new Error("WMTS 沒有回傳可選擇的圖層。");
        }

        wmtsLayerSelect.innerHTML = "";

        layers.forEach(layerInfo => {
          const option = document.createElement("option");

          option.value = layerInfo.Identifier;
          option.textContent =
            layerInfo.Title ||
            layerInfo.Identifier;

          wmtsLayerSelect.appendChild(option);
        });

        wmtsLayerSelect.disabled = false;

        /*
          優先順序：
          1. 上次記錄的底圖；
          2. EMAP；
          3. WMTS 第一個圖層。
        */
        const availableLayerNames = Array.from(
          wmtsLayerSelect.options
        ).map(option => option.value);

        let selectedLayerName = null;

        if (
          preferredLayerName &&
          availableLayerNames.includes(preferredLayerName)
        ) {
          selectedLayerName = preferredLayerName;

        } else if (availableLayerNames.includes("EMAP")) {
          selectedLayerName = "EMAP";

        } else {
          selectedLayerName = layers[0].Identifier;
        }

        wmtsLayerSelect.value = selectedLayerName;
        setWmtsLayer(selectedLayerName);

        statusEl.textContent =
          "WMTS 圖層清單讀取完成，共 " +
          layers.length +
          " 個圖層。";

      } catch (error) {
        console.error(error);

        statusEl.innerHTML =
          "<b>WMTS 圖層清單讀取失敗。</b><br>" +
          "錯誤：" + escapeHtml(error.message) +
          "<br><br>" +
          "<small>請確認可直接開啟：<br>" +
          escapeHtml(
            WMTS_URL +
            "?SERVICE=WMTS&REQUEST=GetCapabilities&VERSION=1.0.0"
          ) +
          "</small>";
      }
    }

    function setWmtsLayer(layerName) {
      try {
        if (!wmtsCapabilities) {
          return;
        }

        const options = ol.source.WMTS.optionsFromCapabilities(
          wmtsCapabilities,
          {
            layer: layerName,
            projection: "EPSG:3857"
          }
        );

        if (!options) {
          throw new Error(
            "找不到 EPSG:3857 / GoogleMapsCompatible 的設定：" +
            layerName
          );
        }

        const newWmtsLayer = new ol.layer.Tile({
          source: new ol.source.WMTS(options),
          zIndex: 0
        });

        if (wmtsLayer) {
          map.removeLayer(wmtsLayer);
        }

        wmtsLayer = newWmtsLayer;

        /*
          底圖放在第 0 層，
          KML、GPS 定位圖層都會顯示在底圖上方。
        */
        map.getLayers().insertAt(0, wmtsLayer);

        statusEl.textContent = "已切換底圖：" + layerName;

        scheduleSaveMapState();

      } catch (error) {
        console.error(error);
        statusEl.textContent = "WMTS 底圖載入失敗：" + error.message;
      }
    }

    wmtsLayerSelect.addEventListener("change", function () {
      setWmtsLayer(this.value);
    });

    /* =========================================================
       KML 圖層
       ========================================================= */

    fileInput.addEventListener("change", async function (event) {
      const files = Array.from(event.target.files);

      if (files.length === 0) {
        return;
      }

      const remainingCount = MAX_KML_LAYERS - kmlLayers.length;

      if (remainingCount <= 0) {
        alert(
          "目前最多只能同時載入 " +
          MAX_KML_LAYERS +
          " 個 KML 圖層。"
        );

        fileInput.value = "";
        return;
      }

      let loadFiles = files;

      if (files.length > remainingCount) {
        alert(
          "目前還可載入 " +
          remainingCount +
          " 個圖層，超出的檔案將不會載入。"
        );

        loadFiles = files.slice(0, remainingCount);
      }

      for (const file of loadFiles) {
        await loadKmlFile(file);
      }

      fileInput.value = "";
    });

    /*
      讀取使用者選擇的本機 KML 檔案。
    */
    function loadKmlFile(file) {
      return new Promise(resolve => {
        const lowerName = file.name.toLowerCase();

        if (!lowerName.endsWith(".kml")) {
          alert(file.name + " 不是 .kml 檔案，已略過。");
          resolve();
          return;
        }

        statusEl.textContent = "正在讀取 KML：" + file.name;

        const reader = new FileReader();

        reader.onload = function (event) {
          try {
            const kmlText = event.target.result;
            const isFirstKml = kmlLayers.length === 0;

            const layerData = createKmlLayerFromText(
              file.name,
              kmlText,
              true,
              isFirstKml,
              true
            );

            statusEl.textContent =
              "已載入 KML：" +
              file.name +
              "，共 " +
              layerData.source.getFeatures().length +
              " 個圖徵。";

          } catch (error) {
            console.error(error);

            alert(
              file.name +
              " 讀取失敗：" +
              error.message
            );
          }

          resolve();
        };

        reader.onerror = function () {
          alert(file.name + " 檔案讀取失敗。");
          resolve();
        };

        reader.readAsText(file, "UTF-8");
      });
    }

    /*
      將 KML 文字建立成獨立圖層。

      fileName：檔名
      kmlText：KML XML 原始文字
      visible：是否顯示
      autoZoom：是否自動縮放至此圖層
      shouldSave：是否自動保存
    */
    function createKmlLayerFromText(
      fileName,
      kmlText,
      visible = true,
      autoZoom = false,
      shouldSave = true
    ) {
      const kmlFormat = new ol.format.KML({
        extractStyles: true,
        showPointNames: false
      });

      /*
        KML 大部分是 WGS84 / EPSG:4326 經緯度。
        顯示時轉換至 EPSG:3857。
      */
      const features = kmlFormat.readFeatures(kmlText, {
        dataProjection: "EPSG:4326",
        featureProjection: "EPSG:3857"
      });

      if (!features || features.length === 0) {
        throw new Error("沒有讀到可用的點、線或面圖徵。");
      }

      const source = new ol.source.Vector({
        features: features
      });

      const vectorLayer = new ol.layer.Vector({
        source: source,
        visible: visible,
        zIndex: 10 + kmlLayers.length
      });

      const layerData = {
        id: nextLayerId++,
        name: fileName,
        text: kmlText,
        layer: vectorLayer,
        source: source
      };

      map.addLayer(vectorLayer);
      kmlLayers.push(layerData);

      renderLayerList();

      if (autoZoom) {
        zoomToLayer(layerData);
      }

      if (shouldSave) {
        scheduleSaveMapState();
      }

      return layerData;
    }

    /*
      顯示 KML 圖層控制清單。
    */
    function renderLayerList() {
      layerListEl.innerHTML = "";

      if (kmlLayers.length === 0) {
        layerListEl.innerHTML =
          '<div style="color:#666; font-size:14px;">尚未載入 KML。</div>';
        return;
      }

      kmlLayers.forEach(layerData => {
        const row = document.createElement("div");
        row.className = "layerItem";

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.checked = layerData.layer.getVisible();
        checkbox.title = "顯示或隱藏圖層";

        checkbox.addEventListener("change", function () {
          layerData.layer.setVisible(this.checked);
          scheduleSaveMapState();
        });

        const name = document.createElement("span");
        name.className = "layerName";
        name.title = layerData.name;
        name.textContent = layerData.name;

        const zoomButton = document.createElement("button");
        zoomButton.type = "button";
        zoomButton.textContent = "定位";
        zoomButton.title = "縮放至此圖層範圍";

        zoomButton.addEventListener("click", function () {
          zoomToLayer(layerData);
        });

        const removeButton = document.createElement("button");
        removeButton.type = "button";
        removeButton.textContent = "移除";
        removeButton.title = "移除此 KML 圖層";

        removeButton.addEventListener("click", function () {
          removeKmlLayer(layerData.id);
        });

        row.appendChild(checkbox);
        row.appendChild(name);
        row.appendChild(zoomButton);
        row.appendChild(removeButton);

        layerListEl.appendChild(row);
      });
    }

    /*
      縮放至指定 KML 圖層。
    */
    function zoomToLayer(layerData) {
      const extent = layerData.source.getExtent();

      if (ol.extent.isEmpty(extent)) {
        alert("此圖層沒有可定位的範圍。");
        return;
      }

      map.getView().fit(extent, {
        padding: [90, 30, 30, 30],
        maxZoom: 18,
        duration: 500
      });
    }

    /*
      移除指定 KML 圖層。
    */
    function removeKmlLayer(id) {
      const index = kmlLayers.findIndex(item => item.id === id);

      if (index === -1) {
        return;
      }

      const layerData = kmlLayers[index];

      map.removeLayer(layerData.layer);
      kmlLayers.splice(index, 1);

      renderLayerList();

      statusEl.textContent = "已移除圖層：" + layerData.name;

      scheduleSaveMapState();
    }

    /*
      清除目前畫面中所有 KML，
      但會保留「自動記錄」功能本身。
    */
    function clearCurrentKmlLayers() {
      kmlLayers.forEach(layerData => {
        map.removeLayer(layerData.layer);
      });

      kmlLayers = [];
      renderLayerList();
    }

    clearAllBtn.addEventListener("click", async function () {
      if (kmlLayers.length === 0) {
        alert("目前沒有已載入的 KML 圖層。");
        return;
      }

      const confirmed = confirm(
        "確定要清除目前所有 KML 圖層嗎？\n\n" +
        "這會更新自動記錄，因此下次開啟時不會再自動恢復這些 KML。"
      );

      if (!confirmed) {
        return;
      }

      clearCurrentKmlLayers();

      await saveCurrentMapState();

      statusEl.textContent =
        "已清除目前 KML 圖層，並更新自動記錄資料。";
    });

    /*
      清除快取資料：
      1. 刪除 IndexedDB 中保存的 KML、底圖、地圖位置。
      2. 移除目前地圖中已載入的 KML。
      3. 重設「自動記錄」為預設啟用。
      4. 不會刪除手機／電腦原始 KML 檔案。
    */
    clearSavedDataBtn.addEventListener("click", async function () {
      const confirmed = confirm(
        "確定要清除快取資料嗎？\n\n" +
        "將會清除：\n" +
        "• 上次選擇的底圖\n" +
        "• 上次載入的 KML\n" +
        "• KML 顯示／隱藏狀態\n" +
        "• 地圖位置與縮放設定\n\n" +
        "不會刪除手機或電腦中的原始 KML 檔案。"
      );

      if (!confirmed) {
        return;
      }

      try {
        /*
          先停止自動儲存，
          避免清除過程又寫入新的空白資料。
        */
        isRestoringSavedState = true;

        clearTimeout(saveTimer);

        /*
          移除目前載入的 KML。
        */
        clearCurrentKmlLayers();

        /*
          刪除 IndexedDB 記錄。
        */
        await dbDelete(STATE_KEY);

        /*
          清除是否自動記錄的偏好後，
          重新回到預設值：打勾。
        */
        localStorage.removeItem(AUTO_SAVE_KEY);
        autoSaveCheckbox.checked = true;

        statusEl.textContent =
          "已清除快取資料與之前載入的 KML。";

      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "清除快取資料失敗：" + error.message;

      } finally {
        isRestoringSavedState = false;
      }
    });

    /* =========================================================
       GPS 定位
       ========================================================= */

    locationBtn.addEventListener("click", function () {
      if (!navigator.geolocation) {
        alert("此瀏覽器不支援定位功能。");
        return;
      }

      locationBtn.disabled = true;
      locationBtn.textContent = "正在定位...";

      statusEl.textContent =
        "正在要求定位權限與取得目前位置...";

      navigator.geolocation.getCurrentPosition(
        function (position) {
          const longitude = position.coords.longitude;
          const latitude = position.coords.latitude;
          const accuracy = position.coords.accuracy;

          const coordinate = ol.proj.fromLonLat([
            longitude,
            latitude
          ]);

          showUserLocation(coordinate, accuracy);

          map.getView().animate({
            center: coordinate,
            zoom: 17,
            duration: 600
          });

          locationBtn.disabled = false;
          locationBtn.textContent = "📍 定位到我的位置";

          statusEl.textContent =
            "定位完成。經度：" +
            longitude.toFixed(6) +
            "，緯度：" +
            latitude.toFixed(6) +
            "，誤差約 ±" +
            Math.round(accuracy) +
            " 公尺。";
        },

        function (error) {
          locationBtn.disabled = false;
          locationBtn.textContent = "📍 定位到我的位置";

          let message = "定位失敗。";

          switch (error.code) {
            case error.PERMISSION_DENIED:
              message =
                "定位被拒絕。請在瀏覽器網站權限中允許位置資訊。";
              break;

            case error.POSITION_UNAVAILABLE:
              message =
                "目前無法取得位置，請確認 GPS、行動網路或 Wi-Fi 已啟用。";
              break;

            case error.TIMEOUT:
              message =
                "定位逾時，請到訊號較佳或戶外的位置後再試一次。";
              break;
          }

          statusEl.textContent = message;
          alert(message);
        },

        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 30000
        }
      );
    });

    /*
      顯示使用者 GPS 位置：
      - 藍點：目前位置
      - 藍色圓形：GPS 誤差範圍
    */
    function showUserLocation(coordinate, accuracy) {
      if (userLocationLayer) {
        map.removeLayer(userLocationLayer);
      }

      const locationFeature = new ol.Feature({
        geometry: new ol.geom.Point(coordinate)
      });

      const accuracyFeature = new ol.Feature({
        geometry: new ol.geom.Circle(coordinate, accuracy)
      });

      userLocationLayer = new ol.layer.Vector({
        source: new ol.source.Vector({
          features: [
            accuracyFeature,
            locationFeature
          ]
        }),

        zIndex: 999,

        style: function (feature) {
          const geometryType = feature.getGeometry().getType();

          if (geometryType === "Circle") {
            return new ol.style.Style({
              fill: new ol.style.Fill({
                color: "rgba(30, 120, 255, 0.13)"
              }),

              stroke: new ol.style.Stroke({
                color: "rgba(30, 120, 255, 0.75)",
                width: 2
              })
            });
          }

          return new ol.style.Style({
            image: new ol.style.Circle({
              radius: 8,

              fill: new ol.style.Fill({
                color: "#1677ff"
              }),

              stroke: new ol.style.Stroke({
                color: "#ffffff",
                width: 3
              })
            })
          });
        }
      });

      map.addLayer(userLocationLayer);
    }

    /* =========================================================
       還原上次記錄
       ========================================================= */

    async function restoreSavedMapState(savedState) {
      if (!savedState) {
        return;
      }

      if (!autoSaveCheckbox.checked) {
        return;
      }

      try {
        isRestoringSavedState = true;

        /*
          還原 KML。
        */
        if (Array.isArray(savedState.kmlLayers)) {
          const restoreLayers = savedState.kmlLayers.slice(
            0,
            MAX_KML_LAYERS
          );

          for (const savedLayer of restoreLayers) {
            try {
              if (!savedLayer.name || !savedLayer.text) {
                continue;
              }

              createKmlLayerFromText(
                savedLayer.name,
                savedLayer.text,
                savedLayer.visible !== false,
                false,
                false
              );

            } catch (error) {
              console.warn(
                "無法還原 KML 圖層：" + savedLayer.name,
                error
              );
            }
          }
        }

        /*
          還原地圖視圖位置。
          若沒有記錄位置但有 KML，則縮放到第一個 KML。
        */
        if (
          savedState.view &&
          Array.isArray(savedState.view.center) &&
          savedState.view.center.length === 2
        ) {
          map.getView().setCenter(savedState.view.center);
          map.getView().setZoom(savedState.view.zoom || 7);

          if (typeof savedState.view.rotation === "number") {
            map.getView().setRotation(savedState.view.rotation);
          }

        } else if (kmlLayers.length > 0) {
          zoomToLayer(kmlLayers[0]);
        }

        if (kmlLayers.length > 0) {
          statusEl.textContent =
            "已還原上次選擇的底圖與 " +
            kmlLayers.length +
            " 個 KML 圖層。";
        }

      } catch (error) {
        console.warn("還原地圖狀態失敗：", error);

      } finally {
        isRestoringSavedState = false;
      }
    }

    /* =========================================================
       工具函式
       ========================================================= */

    function escapeHtml(value) {
      const div = document.createElement("div");
      div.textContent = String(value);
      return div.innerHTML;
    }

    /* =========================================================
       初始化
       ========================================================= */

    async function initializeApp() {
      try {
        /*
          初始化時暫時禁止自動儲存。
        */
        isRestoringSavedState = true;

        /*
          開啟瀏覽器 IndexedDB。
        */
        await openDatabase();

        /*
          先讀取上次保存狀態，
          取得上次使用的 WMTS 圖層名稱。
        */
        let savedState = null;

        if (autoSaveCheckbox.checked) {
          savedState = await dbGet(STATE_KEY);
        }

        const preferredLayerName =
          savedState?.wmtsLayer || null;

        /*
          讀取 WMTS 圖層清單，
          並優先選擇上次使用的底圖。
        */
        await loadWmtsCapabilities(preferredLayerName);

        /*
          還原 KML、顯示狀態、地圖位置。
        */
        await restoreSavedMapState(savedState);

      } catch (error) {
        console.error(error);

        statusEl.textContent =
          "初始化失敗：" + error.message;

      } finally {
        isRestoringSavedState = false;
      }
    }

    initializeApp();
  </script>
